    QuoteCreatePayload:
      type: object
      required:
        - issue_date
        - expiry_date
        - terms_and_conditions
        - currency
        - client_id
        - items
      properties:
        client_id:
          type: string
          format: uuid
          description: Client ID
        issue_date:
