components:
  parameters:
    X-Qonto-Staging-Token:
      name: X-Qonto-Staging-Token
      in: header
      description: Required only for Sandbox API requests; to get one, please sign up to the [Developer Portal](https://developers.qonto.com/).
      schema:
        type: string
    PaginationPage:
      name: page
      in: query
      description: Page number for pagination. Must be greater than 0.
      schema:
        type: integer
        minimum: 1
        default: 1
    PaginationPerPage:
      name: per_page
      in: query
      description: Number of records per page. Must be between 1 and 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    X-Qonto-2fa-Preference:
      name: X-Qonto-2fa-Preference
      in: header
      description: Learn more in [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).
      schema:
        type: string
        enum:
          - paired-device
          - passkey
          - mock
          - sms-otp
        default: paired-device
    X-Qonto-Idempotency-Key:
      name: X-Qonto-Idempotency-Key
      in: header
      required: true
      description: Learn more in [Idempotent Requests](/get-started/general/idempotent-requests).
      schema:
        type: string
        example: 123e4567-e89b-12d3-a456-426614174000
    X-Qonto-Sca-Session-Token:
      name: X-Qonto-Sca-Session-Token
      in: header
      description: Learn more in [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).
      schema:
        type: string
    X-Qonto-MFA:
      name: X-Qonto-MFA
      in: header
      description: Learn more in the [SMS OTP Flow](/api-reference/business-api/authentication/sca/sca-flows#sms-otp-flow).
      schema:
        type: string
    PaymentLinkIdPathParam:
      name: id
      in: path
      description: Payment link ID
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    OAuth:
      type: oauth2
      description: |
        Bearer authorization header: `Bearer <token>`, where `<token>` is the access token received from the authorization server at the end of the [OAuth 2.0 flow](/get-started/business-api/authentication/oauth/oauth-flow).
      flows:
        authorizationCode:
          refreshUrl: https://oauth.qonto.com/oauth2/token
          authorizationUrl: https://oauth.qonto.com/oauth2/auth
          scopes:
            attachment.write: Upload attachments and remove attachments from transactions
            bank_account.write: Create, update and close bank accounts
            beneficiary.trust: Trust SEPA beneficiaries
            card.read: Retrieve cards
            card.write: Create or update cards
            client.read: Retrieve clients
            client.write: Create clients
            client_invoice.write: Create client invoices
            client_invoices.read: Retrieve client invoices and credit notes
            einvoicing.read: Retrieve e-invoicing settings
            embed_auth_link.write: Create Embed auth links
            insurance_contract.read: Retrieve insurance contracts
            insurance_contract.write: Create and update insurance contracts
            internal_transfer.write: Create internal transfers (between 2 Qonto accounts of the same organization)
            international_transfer.write: Create international transfers
            membership.read: Retrieve the authentified membership
            membership.write: Invite team members
            offline_access: Retrieve a refresh token
            organization.read: Retrieve organization, bank accounts, transactions, transfers, beneficiaries, labels, memberships, requests, statements and attachments
            payment.write: Create external transfers and untrust beneficiaries
            payment_link.read: Retrieve payment links, their payments, and the available payment methods
            payment_link.write: Connect to the payment links provider, create and deactivate payment links
            request_cards.write: Create card requests
            request_review.write: Approve or decline requests
            request_transfers.write: Create transfer requests
            supplier_invoice.read: Retrieve supplier invoices
            supplier_invoice.write: Create supplier invoices
            team.read: Retrieve teams
            team.write: Create teams
            webhook: Receive a notification each time a particular event occurs in Qonto
          tokenUrl: https://oauth.qonto.com/oauth2/token
    SecretKey:
      type: apiKey
      description: cf. [API key](/get-started/business-api/authentication/api-key)
      name: Authorization
      in: header
    webhookSignature:
      type: apiKey
      name: X-Qonto-Signature
      in: header
      description: |
        The signature header follows the format `t={timestamp},v1={signature}`.

        Verification steps:
        1. Extract the timestamp and signature from the signature header
        2. Reject the request if the timestamp is older than 5 minutes
        3. Recreate the signed payload: '{timestamp}.{raw_request_body}'
        4. Compute HMAC-SHA256 of the signed payload using your webhook secret as the key
        5. Compare the computed signature with the one in the header
  responses:
    401-Unauthorized:
      description: Returns an unauthorized error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/UnauthorizedError'
          examples:
            authorization_header_missing:
              value:
                errors:
                  - code: authorization_header_missing
                    detail: authorization header missing
            authorization_token_invalid:
              value:
                errors:
                  - code: authorization_token_invalid
                    detail: authorization token invalid
    403-Forbidden:
      description: Returns a forbidden error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/ForbiddenError'
          examples:
            Insufficient permissions:
              value:
                errors:
                  - code: forbidden
                    detail: User does not have sufficient permissions for this action.
    404-Not-Found:
      description: Returns a not found error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/NotFoundError'
    500-Internal-Server-Error:
      description: Returns an internal server error.
    400-Bad-request:
      description: Returns a bad request error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/BadRequestError'
          examples:
            Authorization field missing:
              value:
                errors:
                  - code: bad_request
                    detail: Authorization field missing
    428-Precondition-required:
      description: Returns SCA precondition required error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    detail:
                      type: string
                  required:
                    - code
            required:
              - errors
          examples:
            SCA approval is required on the paired device:
              value:
                errors:
                  - code: sca_required
                    detail: You must enable SCA to perform this action
    422-Unprocessable-Entity:
      description: Returns an unprocessable entity error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/UnprocessableEntityError'
            x-examples:
              Example 1:
                errors:
                  - code: missing_key
                    detail: reference is missing
                    source:
                      pointer: /external_transfer/reference
    400-Client-Invoice-Bad-Request:
      description: Returns a bad request error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '400'
                    code:
                      type: string
                      enum:
                        - bad_request
                        - invalid_request_format
                        - malformed_json
                      example: bad_request
                    detail:
                      type: string
                      example: The request is malformed or contains invalid data
          examples:
            bad_request:
              value:
                errors:
                  - status: '400'
                    code: bad_request
                    detail: The request is malformed or contains invalid data
    401-Client-Invoice-Unauthorized:
      description: Returns an unauthorized error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '401'
                    code:
                      type: string
                      enum:
                        - unauthorized
                        - invalid_token
                        - token_expired
                      example: unauthorized
                    detail:
                      type: string
                      example: Authentication is required to access this resource
          examples:
            unauthorized:
              value:
                errors:
                  - status: '401'
                    code: unauthorized
                    detail: Authentication is required to access this resource
    403-Client-Invoice-Forbidden:
      description: Returns a forbidden error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '403'
                    code:
                      type: string
                      enum:
                        - forbidden
                        - insufficient_permissions
                        - access_denied
                      example: forbidden
                    detail:
                      type: string
                      example: You do not have permission to access this resource
          examples:
            forbidden:
              value:
                errors:
                  - status: '403'
                    code: forbidden
                    detail: You do not have permission to access this resource
    422-Client-Invoice-Unprocessable-Entity:
      description: Returns a validation error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '422'
                    code:
                      type: string
                      enum:
                        - invalid
                        - missing_field
                        - invalid_format
                        - invalid_client_id
                        - invalid_invoice_data
                      example: invalid
                    detail:
                      type: string
                      example: due_date should be greater or equal than issue_date.
                    source:
                      type: object
                      properties:
                        pointer:
                          type: string
                          example: /data/attributes/due_date
                    meta:
                      type: object
                      properties:
                        validation_param:
                          type: string
                          example: IssueDate
          examples:
            invalid:
              value:
                errors:
                  - status: '422'
                    code: invalid
                    detail: '`due_date` should be greater or equal than `issue_date`.'
                    source:
                      pointer: /data/attributes/due_date
                    meta:
                      validation_param: IssueDate
    500-Client-Invoice-Internal-Server-Error:
      description: Returns an internal server error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '500'
                    code:
                      type: string
                      enum:
                        - internal_server_error
                        - service_unavailable
                        - processing_error
                      example: internal_server_error
                    detail:
                      type: string
                      example: An internal server error occurred while processing the request
          examples:
            internal_server_error:
              value:
                errors:
                  - status: '500'
                    code: internal_server_error
                    detail: An internal server error occurred while processing the request
    409-Client-Invoice-Conflict:
      description: Returns a conflict error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '409'
                    code:
                      type: string
                      enum:
                        - invoice_number_already_exists
                        - client_invoice_conflict
                      example: invoice_number_already_exists
                    source:
                      type: object
                      properties:
                        pointer:
                          type: string
                          example: /data/attributes/number
          examples:
            invoice_number_already_exists:
              value:
                errors:
                  - status: '409'
                    code: invoice_number_already_exists
                    source:
                      pointer: /data/attributes/number
    404-Client-Invoice-Not-Found:
      description: Returns a not found error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '404'
                    code:
                      type: string
                      enum:
                        - not_found
          examples:
            not_found:
              value:
                errors:
                  - status: '404'
                    code: not_found
    412-Client-Invoice-Precondition-Failed:
      description: Returns a precondition failed error specific to client invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                      example: '412'
                    code:
                      type: string
                      enum:
                        - forbidden_invoice_update
                        - forbidden_invoice_deletion
                        - invoice_not_in_draft_status
                      example: forbidden_invoice_update
          examples:
            forbidden_invoice_update:
              value:
                errors:
                  - status: '412'
                    code: forbidden_invoice_update
            forbidden_invoice_deletion:
              value:
                errors:
                  - status: '412'
                    code: forbidden_invoice_deletion
            invoice_not_in_draft_status:
              value:
                errors:
                  - status: '412'
                    code: invoice_not_in_draft_status
    409-Conflict:
      description: Returns a conflict error.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/ConflictError'
    412-Precondition-Failed:
      description: Invalid SCA session token
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: A human readable message describing the error
                example: Invalid SCA session token
              code:
                type: string
                description: The error code
                example: invalid_sca_session
  schemas:
    UnauthorizedError:
      type: object
      properties:
