        file_name:
          type: string
          example: my-invoice.pdf
        invoice_number:
          type: string
          example: QONTO-JAN-2022
        supplier_name:
          type: string
          example: McDonald's
        vat_number:
          type: string
          nullable: true
          example: IT12345678901
