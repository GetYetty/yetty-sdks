  /v2/requests:
    get:
      tags:
        - Requests
      summary: List requests
      description: |
        OAuth scope: `organization.read`

        Retrieves the list of requests for the authenticated organizations.

        You can filter (ex: only retrieve a specific request type) and sort this list by using [query parameters](#parameter-status) 👇

        <Info>
          **Price plans**: this endpoint is only accessible by organizations in a Business or Enterprise plan.
        </Info>
      operationId: list_requests
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: status[]
          in: query
          description: |-
            Requests can be filtered by their `status`.
            This filter accepts an array of the following statuses:
             `pending`: a request still waiting for final status.
             - `approved`: a request that has been approved by approver. Final status.
             - `declined`: a request that has been declined by approver. Final status.
             - `canceled`: a request that has been canceled by requester. Final status.
          schema:
            type: array
            default: all statuses
            items:
              type: string
              enum:
                - pending
                - approved
                - canceled
                - declined
            example: status[]=approved&status[]=declined&status[]=pending
        - name: request_type[]
          in: query
          description: |-
            Requests can be filtered by their `request_type`.
            This filter accepts an array of the following  statuses:
            - `flash_card`: a flash card is a non-physical card with a budget and a last day of validity. The card becomes inactive after the budget is totally spent or the last date of validity is past.
            - `virtual_card`: a virtual card is a non-physical card with a monthly budget. Card holder can spend that amount every calendar month. Above that, transactions will be refused.
            - `transfer`: a transfer of money from one Qonto account to another account.
            - `multi_transfer`: several transfers executed at the same time. A document can be provided to create a multi-transfer which is composed of many different transfers.
          schema:
            type: array
            default: all request types
            items:
              type: string
              enum:
                - transfer
                - multi_transfer
                - flash_card
                - virtual_card
            example: request_type[]=transfer&request_type[]=multi_transfer
        - name: created_at_from
          in: query
          description: Requests can be filtered by their `created_at` property. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2019-01-10T11:47:53.123Z'
        - name: processed_at_from
          in: query
          description: Requests can be filtered by their `processed_at` property. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2019-01-10T11:47:53.123Z'
        - name: sort_by
          in: query
          description: |-
            Requests can be sorted by a specific property and order.
            Property: `processed_at`, `created_at` or `status`
            Order: `asc` (Ascending) / `desc` (Descending)

            **Do note**: Sorting by `status:asc` returns a list of requests with statuses in the following order: `pending`, `approved`, `declined`, `canceled`.
          schema:
            type: string
            default: created_at:desc
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
        - name: per_page
          in: query
          description: Number of requests per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
      responses:
        '200':
          description: Returns the list of requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/RequestFlashCard'
                        - $ref: '#/components/schemas/RequestVirtualCard'
                        - $ref: '#/components/schemas/RequestMultiTransfer'
                        - $ref: '#/components/schemas/RequestTransfer'
                  meta:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - requests
                  - meta
              examples:
                default:
                  value:
                    meta:
                      current_page: 1
                      next_page: null
                      prev_page: null
                      total_pages: 1
                      total_count: 4
                      per_page: 25
                    requests:
                      - id: 965b8c57-72fd-4d12-8d85-56874104c81a
                        request_type: virtual_card
                        status: pending
                        initiator_id: cc32875a-a590-44c7-bdc1-0680ae72b0db
                        approver_id: null
                        note: Library subscription
                        declined_note: null
                        payment_monthly_limit: '5.00'
                        currency: EUR
                        processed_at: null
                        created_at: '2021-11-24T10:34:51.706Z'
                      - id: fd6d72c0-557d-4d51-8502-d7ce86cb72ea
                        request_type: flash_card
                        status: canceled
                        initiator_id: dbbb579a-f8a5-41df-8cea-09e040464366
                        approver_id: null
                        note: Restaurant
                        declined_note: null
                        pre_expires_at: '2022-03-15T22:59:59.999Z'
