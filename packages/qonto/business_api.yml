    PaymentLinkConnection:
      type: object
      required:
        - connection_location
        - status
        - bank_account_id
      properties:
        connection_location:
          type: string
          description: URL to redirect the user to initiate the connection.
        status:
          type: string
          enum:
            - enabled
            - pending
            - disabled
            - not_connected
          description: |
            Status of the overall payment links feature activation:

            - `enabled`: The payment links feature is active, and the connection with the provider has been established.
            - `pending`: The provider requires the user to complete additional steps in the onboarding process. While no action is required from you, you may choose to notify your users about this status.
            - `disabled`: The payment links feature is not active.
            - `not_connected`: The connection with the provider has not yet been established.
          example: not_connected
        bank_account_id:
          type: string
          format: uuid
          description: The bank account ID to be credited when the payment link is paid.
          example: 46e9e0d2-f1af-4d2e-a6be-a536a604b89e
    GetPaymentLinkConnectionResponse:
      allOf:
        - $ref: '#/components/schemas/PaymentLinkConnection'
