  /v2/credit_notes:
    get:
      tags:
        - Credit Notes
      summary: List credit notes
      description: |-
        OAuth scope: `client_invoices.read`



        Retrieves the list of credit notes for the authenticated organization.

        You can filter (ex: only retrieve the latest credit notes) and sort this list by using [query parameters](#parameter-filter-created-at-from) 👇
      operationId: list_credit_notes
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: filter[created_at_from]
          in: query
          description: Credit notes can be filtered by their `created_at` property. Can be use in combination with the `created_at_to` query parameter to get credit notes created within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-02-01T12:01:02Z'
        - name: filter[created_at_to]
          in: query
          description: Credit notes can be filtered by their `created_at` property. Can be use in combination with the `created_at_from` query parameter to get credit notes created within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-23-04T16:23:00Z'
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          description: Number of credit notes per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            maximum: 100
            default: 1
        - name: sort_by
          in: query
          description: 'Credit notes can be sorted by their `created_at` property in 2 possible orders: `asc` (Ascending) / `desc` (Descending).'
          schema:
            type: string
            default: created_at:desc
      responses:
        '200':
          description: Returns the list credit notes.
