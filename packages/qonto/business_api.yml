    ClientCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of the client that needs to pay the client invoice.
          example: John Doe
        first_name:
          type: string
          description: First name of the client that needs to pay the invoice.
          example: John
        last_name:
          type: string
          description: Last name of the client that needs to pay the invoice.
          example: Doe
        phone_number:
          type: string
          description: Phone number of the client that needs to pay the invoice. Deprecated, use `phone` instead.
          example: '+33123456789'
          deprecated: true
        phone:
          type: object
          description: Phone country code and number of the client that needs to pay the invoice.
          properties:
            country_code:
              type: string
              description: Country code of the client's phone number.
              example: '+33'
            number:
              type: string
              description: Phone number of the client.
              example: '123456789'
        kind:
          type: string
          enum:
            - company
            - individual
            - freelancer
          description: |
            Describes the client type. `individual` represents a physical person (a consumer) whereas `company` or `freelancer` represent a legal entity. Usually a `freelancer` is a legal entity with the name of a person.
        type:
          type: string
          deprecated: true
          enum:
            - company
            - individual
            - freelancer
          description: |
            Describes the client type. `individual` represents a physical person (a consumer) whereas `company` or `freelancer` represent a legal entity. Usually a `freelancer` is a legal entity with the name of a person.
        email:
          type: string
          description: E-mail address of the client that needs to pay the invoice, which is displayed in the invoice.
          format: email
          example: john.doe@qonto.eu
        extra_emails:
          type: array
          description: |
            Additional email addresses for the client.
            Store additional emails that won't appear in the document but will be used as recipients when sending the document via email.
          nullable: true
          items:
            type: string
            format: email
            nullable: false
            maxLength: 250
            example: additional@email.com
          maxItems: 100
          example:
            - additional@email.com
            - backup@email.com
        currency:
          type: string
          description: Client's currency.
          example: EUR
        e_invoicing_address:
          type: string
          description: |
            Specifically for French organizations.
            A unique address in one of the formats:
            - siren e.g. 987654321
            - siren_siret e.g. 987654321_98765432100012
            - siren_siret_routingCode e.g. 987654321_98765432100012_00001
            - siren_suffix e.g. 987654321_00002

            Note the address should also exist in the Annuaire to be accepted.
          example: '987654321'
        vat_number:
          type: string
          description: Value Added Tax number of the client (a legal entity) that needs to pay the invoice.
        tax_identification_number:
          type: string
          description: Tax Identification Number of the client (a physical person) that needs to pay the invoice. It corresponds to the SIREN/SIRET for French companies.
        address:
          type: string
          description: Address of the client that needs to pay the invoice.
        city:
          type: string
          description: City of the client that needs to pay the invoice.
        zip_code:
          type: string
          description: Zip code of the client that needs to pay the invoice.
        province_code:
          type: string
          description: Only for italian organizations. Represents the province code of the client.
        country_code:
          type: string
          description: Country code of the client that needs to pay the invoice.
        billing_address:
          type: object
          description: Billing address of the client that needs to pay the invoice. Stores the same data as the root-level fields address fields (`address`, `city`, `zip_code`, `province_code`, `country_code`).
          properties:
            street_address:
              type: string
              description: |
                represent the street address section of the billing address of the client. (eg street, number, floor, door, etc)
              maxLength: 250
              example: 123 Main Street
            city:
              type: string
              description: City on the billing address of the client that needs to pay the invoice
              maxLength: 50
              example: Paris
            zip_code:
              type: string
              description: Zip code on the billing address of the client that needs to pay the invoice
              maxLength: 20
              example: '75009'
            province_code:
              type: string
              description: Province code of the client's billing address
              maxLength: 2
            country_code:
              type: string
              description: Country code on the billing address of the client that needs to pay the invoice
              maxLength: 2
              example: fr
        delivery_address:
          type: object
          description: Delivery address of the client that needs to pay the invoice. Stores the same data as the root-level fields address fields (`address`, `city`, `zip_code`, `province_code`, `country_code`).
          properties:
            street_address:
              type: string
