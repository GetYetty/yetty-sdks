    DocumentItemPayload:
      type: object
      properties:
        title:
          type: string
          description: Item’s title. It is displayed as the first line of the item in bold in the invoice table. It indicates in a short sentence the product or service being sold.
          maxLength: 40
        description:
          type: string
          description: Item’s description of the product or service being sold. It is added below the title of each item in the invoice table. Free format, with a maximum of 300 characters. Use `\n` to indicate line breaks.
          maxLength: 1800
        quantity:
          type: string
          description: Item’s quantity of the specific product or services being sold. For example, it can be in hours or in number of products. Decimals should be separated by a period “.”
          example: '0.5'
        unit:
          type: string
          description: |
            Item’s unit. It is an optional field and allows maximum 20 characters for non Italian organizations.
            - For Italian organizations, documents are generated in PDF format and in XML format (automatically sent to the Italian tax authorites). In the PDF, unit will appear with a maximum of 20 characters. In the XML file, it is truncated down to the first 10 characters.
            - For French organizations, documents are generated under the Factur-X format (a structured PDF file with an embedded XML). For the XML file, units that have a corresponding EN16931 code (standard followed by Factur-X format) will be indicated with its relevant code. See mapping below of possible values and their corresponding code.

            <details>
            <summary>Possible values and corresponding EN16931 code (pursuant to the <a href"'https://www.impots.gouv.fr/specifications-externes-b2b">“Annexe 7” of the B2B external specifications for French e-invoicing</a>, BT-130, allowed units of measure)</summary>

            | Unit                    | EN16931 code |
            |-||
            | unit                    | C62  |
            | hour                    | HUR  |
            | day                     | DAY  |
            | month                   | MON  |
            | gram                    | GRM  |
            | kilogram                | KGM  |
            | liter                   | LTR  |
            | meter                   | MTR  |
            | square_meter            | MTK  |
            | cubic_meter             | MTQ  |
            | ampere                  | AMP  |
            | number_of_articles      | NAR  |
            | centimeter              | CMT  |
            | cubic_meter_per_hour    | MQH  |
            | gigajoule               | GV   |
            | gigawatt                | A90  |
            | gigawatt_hour           | GWH  |
            | half_year               | SAN  |
            | joule                   | JOU  |
            | kilojoule               | KJO  |
            | kilovar                 | KVR  |
            | kilovolt_ampere_reactive_hour | K3  |
            | kilowatt                | KWT  |
            | kilowatt_hour           | KWH  |
            | megajoule               | 3B   |
            | megawatt                | MAW  |
            | megawatt_hour           | MWH  |
            | milligram               | MGM  |
            | milliliter              | MLT  |
            | millimeter              | MMT  |
            | minute                  | MIN  |
            | pair                    | PR   |
            | quarter                 | QAN  |
            | second                  | SEC  |
            | set                     | SET  |
            | ton                     | TNE  |
            | two_week                | W4   |
            | watt_hour               | WHR  |
            | week                    | WEE  |
            | year                    | ANN  |
            | custom_input_text       | ZZ   |
            </details>
          example: meter
        unit_price:
          type: object
          properties:
            value:
              type: string
              description: Price per unit of product or service sold. Decimals should be separated by a period “.”
            currency:
              type: string
              description: Item’s currency. Currently, only value allowed is EUR. Format supported is a trigram following ISO 4217.
          required:
            - value
            - currency
        vat_rate:
          type: string
          description: VAT rate applicable for that particular item. Written in decimals, separated by a period “.” For example, for a VAT of 10%, input is 0.1
          example: '0.1'
        vat_exemption_reason:
          type: string
          enum:
            - N1
            - N2
            - N2.1
            - N2.2
            - N3
            - N3.1
            - N3.2
            - N3.3
            - N3.4
            - N3.5
            - N3.6
            - N4
            - N5
            - N6
            - N6.1
            - N6.2
            - N6.3
            - N6.4
            - N6.5
            - N6.6
            - N6.7
            - N6.8
            - N6.9
            - N7
            - S293B
            - S262.1
            - S259
            - S283
            - S261
            - S262
            - S263
            - S19.1
            - S4.1B
            - S4.1A
            - S4
            - S13B
            - S122
            - S25
            - S21
            - S69
            - S20
            - S84.1.2
          description: VAT exemption reason when the item’s vat_rate is equal to 0. It is required for Italian organizations only, must be indicated for each item that has a VAT rate of 0 and the code must start with `N`. If VAT rate is not 0, this field should not be included.
          maxLength: 4
          example: N1
        discount:
          type: object
          properties:
            type:
              type: string
              enum:
                - percentage
                - absolute
              description: Type of the discount for that item.
              example: percentage
            value:
              type: string
              description: Rate or the absolute amount that will be discounted
              example: '0.1'
      required:
        - title
        - quantity
        - unit_price
        - vat_rate
    ClientInvoiceCreatePayload:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
          description: |
            The ID of the associated client. The client is validated against the business rules of the invoicing domain.
            In case of getting a validation error related to a field in the customer, you will need to issue a request to
            update the customer itself and then try to re-create the invoice itself.
            This is because a client can be used across different domains - client creation performs only minimal 
            validations on the client and then it is up to each domain (for example, invoicing) to apply their own 
            business rules on top of that client. More information can be found in [the docs for creating a client](/api-reference/business-api/endpoints/client-invoices/create-a-client-invoice).
        issue_date:
          type: string
          format: date
          example: '2022-03-01'
        performance_date:
          type: string
          description: |
            **DEPRECATED**: This field is deprecated. Please use `performance_start_date` and `performance_end_date` instead.

            The performance date represents when the job or service is expected to be completed by the client. Date the initiator has issued or shared the invoice as legally viable. The format should be `YYYY-MM-DD`
          format: date
          deprecated: true
        performance_start_date:
          type: string
          description: |
            Start date of the performance period for the invoice. The format should be `YYYY-MM-DD`.

            The performance period defines the date range during which the job or service is expected to be completed by the client. This field marks the beginning of that period and can be used together with `performance_end_date` to create a flexible date range instead of a single fixed date.

            **Validation rules:**
            - Required if `performance_end_date` is provided
            - Must be less than or equal to `performance_end_date` when both are provided

            **Fallback behavior:**
            - If not provided, the system will use the deprecated `performance_date` value as fallback
            - If provided, this value will override the deprecated `performance_date` field
          format: date
          example: '2022-03-01'
        performance_end_date:
          type: string
          description: |
            End date of the performance period for the invoice. The format should be `YYYY-MM-DD`.

            This field defines the end of the performance date range, allowing clients to complete the job or service anytime between `performance_start_date` and `performance_end_date`. When used together with `performance_start_date`, it creates a flexible time window rather than requiring completion on a specific date.

            **Validation rules:**
            - Optional field
            - When provided, `performance_start_date` becomes required
            - Must be greater than or equal to `performance_start_date`
          format: date
          example: '2022-03-31'
        due_date:
          type: string
          description: Payment deadline that is added by the initiator. The format should be `YYYY-MM-DD`
          format: date
        status:
          type: string
          enum:
            - draft
            - unpaid
          description: Invoice's status. If not filled, `unpaid` will be automatically propertyd to the invoice.
        number:
          type: string
          description: |-
            Invoice's number. Must be unique within the organization and is:
            - **required** if automatic numbering is disabled for the authenticated organization (default setting);
            - **optional** if automatic numbering is enabled for the authenticated organization.
              However, if provided, it will be used as the invoice's number.
          maxLength: 40
          example: INV-2023-001
        purchase_order:
          type: string
          description: Purchase order data added by the invoice’s initiator.
          maxLength: 40
        terms_and_conditions:
          type: string
          description: Additional notes added by the invoice’s initiator.
          maxLength: 525
        header:
          type: string
          example: This is an example.
        footer:
          type: string
          example: This is an example.
        currency:
          type: string
          description: Currency for the total amount of the invoice. Currently, only value allowed is EUR. Trigram following ISO 4217
          example: EUR
        payment_methods:
          type: object
          description: Payment method details for the invoice.
          properties:
            iban:
              type: string
              description: Beneficiary’s International Bank Account Number (IBAN). The format must follow ISO 13616, and should be a valid IBAN (must start with two letters, followed by 25 digits). The IBAN must be associated to a Qonto account.
          required:
            - iban
        settings:
          $ref: '#/components/schemas/InvoiceSettingsOverride'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItemPayload'
        report_einvoicing:
          type: boolean
          description: |-
            - For Italian organizations only
            - Non-Italian organizations should not include this property in the request.
            - Italian organizations must have e-invoicing activated to use this endpoint, no matter the value of the flag.
            - By default for an Italian organization that has e-invoicing activated on the Qonto app, if this field is not filled, this property is set to true and the invoice is automatically sent to Italian exchange system (Sistema di Interscambio, or SdI) as an XML e-invoice. If set to `false`, the invoice will not be sent to SdI.
            - Use the `GET` v2/client_invoices to retrieve its e-invoicing status under the property `einvoicing_status`.
        payment_reporting:
          type: object
          description: |-
            - For Italian organizations only
            - Non-Italian organizations should not include this property in the request.
            - Object which relates to payment methods and conditions of the invoice.
          properties:
            conditions:
              type: string
              enum:
                - TP01
                - TP02
                - TP03
              description: Payment conditions on the invoice.
              example: TP01
            method:
              type: string
              enum:
                - MP01
                - MP02
                - MP03
                - MP04
                - MP05
                - MP06
                - MP07
                - MP08
                - MP09
                - MP10
                - MP11
                - MP12
                - MP13
                - MP14
                - MP15
                - MP16
                - MP17
                - MP18
                - MP19
                - MP20
                - MP21
                - MP22
              description: Payment method of the invoice.
              example: MP01
          required:
            - conditions
            - method
        welfare_fund:
          type: object
          description: |-
            - For Italian organizations only
            - Non-Italian organizations should not include this property in the request.
            - Object which relates to pension contributions added to the total amount to pay, applicable in some cases.
            - This amount is a percentage added to the total amount of the invoice pre-taxes.
          properties:
            type:
              type: string
              enum:
                - TC01
                - TC02
                - TC03
                - TC04
                - TC05
                - TC06
                - TC07
                - TC08
                - TC09
                - TC10
                - TC11
                - TC12
                - TC13
                - TC14
                - TC15
                - TC16
                - TC17
                - TC18
                - TC19
                - TC20
                - TC21
                - TC22
              description: Welfare fund type.
              example: TC01
            rate:
              type: string
              description: Welfare fund rate applicable for the invoice. Written in decimals, separated by a period “.” For example, for a rate of 1%, input is 0.01, and for a rate of 10%, input is 0.1
              minLength: 4
              maxLength: 6
              example: '0.0001'
          required:
            - type
            - rate
        withholding_tax:
          type: object
          description: |-
            - Only for Italian organizations and Spanish freelancers
            - Other organizations should not include this property in the request.
            - Object which relates to an amount of tax paid by the client, rather than the supplier, for specific cases.
            - This amount is a percentage deducted from the total amount of the invoice after VAT application.
            - ES freelancers need to only fill the withholding_tax `rate` field with their IRPF.
          properties:
            reason:
              type: string
              enum:
                - RF01
                - RF02
                - RF03
                - RF04
                - RF05
                - RF06
              description: Reason the withholding tax.
              example: RF01
            rate:
              type: string
              description: Withholding tax rate applicable for the invoice. Written in decimals, separated by a period “.” For example, for a rate of 1%, input is 0.01 and for a rate of 10%, input is 0.1
              minLength: 4
              maxLength: 6
              example: '0.01'
            payment_reason:
              type: string
              description: Payment reason the withholding tax.
              minLength: 1
              maxLength: 2
              example: L1
          required:
            - reason
            - rate
            - payment_reason
        stamp_duty_amount:
          type: string
          description: |-
            - For Italian organizations only
            - Non-Italian organizations should not include this property in the request.
            - Represents an amount (2.00 EUR) applicable on invoices where VAT is excluded and the invoice has a value exceeding 77.47 EUR.
          minLength: 4
          maxLength: 15
          example: '1.00'
      required:
        - client_id
        - issue_date
        - due_date
        - currency
        - payment_methods
        - items
