        - OAuth:
            - request_transfers.write
  /v2/requests/{request_type}/{id}/approve:
    post:
      tags:
        - Requests
      summary: Approve a request
      description: |
        OAuth scope: `request_review.write`

        Accessible only using [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).

        <Info>
          Example of SCA usage: [**Postman visual flow**](https://www.postman.com/qontoteam/workspace/qonto-public-api/flow/6670429eb7bd63003156bd57)
        </Info>

        Approves the pending request identified by the `id` path parameter. This request will change status from `status` = `pending` to `status` = `approved`.

        You can ge the list of all the requests via the  [GET /v2/requests](/api-reference/business-api/endpoints/requests/list-requests) endpoint.

        <Tip>
          In the [Qonto web-ap](https://app.qonto.com/), requests can be listed and approved in the "Requests" tab.
        </Tip>
      operationId: approve_request
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
        - name: id
          in: path
          description: UUID of the request to be processed.
          required: true
          schema:
            type: string
        - name: request_type
          in: path
          description: Type of a request to be approved.
          required: true
          schema:
            type: string
            enum:
              - flash_cards
              - virtual_cards
              - transfers
              - multi_transfers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: IBAN of account to debit for transfers or multi_transfers or IBAN of the account to link to the card for flash_cards or virtual_cards. If empty, the main account will be debited or linked.
              properties:
                debit_iban:
                  type: string
                  format: uuid
                  example: FR7616958000019475096658493
      responses:
        '200':
          description: Returns the approved request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_transfer:
                    type: object
                    oneOf:
                      - $ref: '#/components/schemas/RequestTransfer'
                      - $ref: '#/components/schemas/RequestMultiTransfer'
                      - $ref: '#/components/schemas/RequestFlashCard'
                      - $ref: '#/components/schemas/RequestVirtualCard'
                    discriminator:
                      propertyName: request_type
                example:
                  request_transfer:
                    id: be160c90-058e-487a-b775-5b5cad3992aa
                    request_type: transfer
                    initiator_id: 8fdb86eb-8e49-4be8-ab60-658b680629af
                    approver_id: null
                    note: personal needs
                    declined_note: null
                    status: approved
                    currency: EUR
                    processed_at: null
                    created_at: '2021-10-11T14:28:28Z'
              examples:
                default:
                  value:
                    request_transfer:
                      id: be160c90-058e-487a-b775-5b5cad3992aa
                      request_type: transfer
                      initiator_id: 8fdb86eb-8e49-4be8-ab60-658b680629af
                      approver_id: null
                      note: personal needs
                      declined_note: null
                      status: approved
                      currency: EUR
                      processed_at: null
                      created_at: '2021-10-11T14:28:28Z'
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '422':
          description: Returns an unprocessable entity error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/UnprocessableEntityError'
                x-examples:
                  Example 1:
                    errors:
                      - code: insufficient_funds
                        detail: Chosen bank account doesn't have enough funds
                        source:
                          properties:
                            pointer: /bank_account_id
              examples:
                Insufficient funds:
                  value:
                    errors:
                      - code: insufficient_funds
                        detail: Chosen bank account doesn't have enough funds
                        source:
                          properties:
                            pointer: /bank_account_id
                KYC not accepted:
                  value:
                    errors:
                      - code: kyc_not_accepted
                        detail: Approver kyc is not accepted
        '428':
          $ref: '#/components/responses/428-Precondition-required'
        '500':
