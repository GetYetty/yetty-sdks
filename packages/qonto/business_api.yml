  /v2/supplier_invoices/bulk:
    post:
      tags:
        - Supplier Invoices
      summary: Create supplier invoices
      description: |
        OAuth scope: `supplier_invoice.write`



        Creates supplier invoices **in bulk** for the authenticated organization by uploading files.

        <Info>
          **Price plans**: this endpoint is available for all Qonto price plans.
        </Info>
      operationId: bulk_create_supplier_invoices
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                supplier_invoices:
                  type: array
                  items:
                    type: object
                    oneOf:
                      - properties:
                          file:
                            type: string
                            format: binary
                          idempotency_key:
                            type: string
                            description: This is a unique string (we advise to use a `uuid`) that identifies an invoice. This is used by Qonto to prevent performing the same operation twice.
                        required:
                          - file
                          - idempotency_key
                        not:
                          required:
                            - attachment_id
                      - properties:
                          attachment_id:
                            type: string
                            format: uuid
                          idempotency_key:
                            type: string
                        required:
                          - attachment_id
                          - idempotency_key
                        not:
                          required:
                            - file
                source:
                  type: string
                  example: pay_by_invoice
                  enum:
                    - pay_by_invoice
                    - supplier_invoices
                    - integration
                    - transaction_attachment
                    - generic_upload
                meta:
                  type: object
                  description: Field used to append metadata to supplier invoices.
                  properties:
                    integration_type:
                      type: string
                      example: dropbox
                    connector:
                      type: string
                      example: grover
                skip_attachment_matcher:
                  type: boolean
                  description: If true, skips the attachment matcher step for all invoices in the bulk request.
                  example: false
              required:
                - supplier_invoices
            examples:
              example:
                value:
                  supplier_invoices:
                    - file: path/to/file1.pdf
                      idempotency_key: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
        description: |-
          You have to specify multipart form data in order to attach the file to the request. When using `curl` it will look like that:

          ```
          curl --location --request POST 'https://thirdparty.qonto.com/supplier_invoices/bulk' \
            --form 'supplier_invoices[][file]=@"/path/to/file1.png"' \
            --form 'supplier_invoices[][idempotency_key]="4d5418bb-bd0d-4df4-865c-c07afab8bb48"' \
            --form 'supplier_invoices[][file]=@"/path/to/file2.png"' \
            --form 'supplier_invoices[][idempotency_key]="4d5418bb-bd0d-4df4-865c-c07afab8bb49"' \
            --form 'source="pay_by_invoice"' \
            --form 'meta="{\"integration_type\":\"dropbox\",\"connector\":\"grover\"}"' \
            --form 'skip_attachment_matcher=true'
          ```
      responses:
        '200':
          description: |-
            Returns the supplier invoices created.

              This endpoint will always return a 200 regardless if there are any errors. Clients must ensure to check the `errors` property in order to confirm if all operations were successful.
              A 400 will be returned only if the whole request fails.
          content:
            application/json:
              schema:
                type: object
                required:
                  - supplier_invoices
                  - errors
                properties:
                  supplier_invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierInvoice'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
              examples:
                when there are only successes:
                  value:
                    supplier_invoices:
                      - id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                        organization_id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                        file_name: invoice 101/2022.pdf
                        invoice_number: QONTO-JAN-2022
                        supplier_name: McDonald's
                        description: This is an invoice for Ronald!
                        total_amount:
                          value: '22.10'
                          currency: EUR
                        due_date: '2022-03-01'
                        payment_date: '2022-03-01'
                        scheduled_date: '2022-03-01'
                        status: to_review
                        iban: FR1420041010050500013M02606
                        initiator_id: 89fq18bb-bd0d-4df4-865c-c07afab882a
                        source_type: email
                        source: email_forward
                        created_at: '2022-03-04T17:58:30+02:00'
                        updated_at: '2022-03-04T17:58:30+02:00'
                        attachment_id: 08c66e1f-dded-4823-8fa3-29bed4d5e873
                        analyzed_at: '2022-03-04T17:58:30+02:00'
                        request_transfer:
                          id: 9d5718bb-bd0d-4df4-865c-c07afab8bb5
                          initiator_id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                        is_einvoice: false
                        display_attachment_id: 8c66e1f-dded-4823-8fa3-29bed4d5e873
                        declined_note: declined
                        has_discrepancies: false
                    errors: []
                when there is a mix of successes and errors:
                  value:
                    supplier_invoices:
                      - id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                        organization_id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                        file_name: invoice 101/2022.pdf
                        declined_note: declined
                        is_einvoice: false
                        has_discrepancies: false
                        display_attachment_id: 8c66e1f-dded-4823-8fa3-29bed4d5e873
                        invoice_number: QONTO-JAN-2022
                        supplier_name: McDonald's
                        description: This is an invoice for Ronald!
                        total_amount:
                          value: '22.10'
                          currency: EUR
                        due_date: '2022-03-01'
                        payment_date: '2022-03-01'
                        scheduled_date: '2022-03-01'
                        status: to_review
                        iban: FR1420041010050500013M02606
                        initiator_id: 89fq18bb-bd0d-4df4-865c-c07afab882a
                        source_type: email
                        source: email_forward
                        created_at: '2022-03-04T17:58:30+02:00'
                        updated_at: '2022-03-04T17:58:30+02:00'
                        attachment_id: 08c66e1f-dded-4823-8fa3-29bed4d5e873
                        analyzed_at: '2022-03-04T17:58:30+02:00'
                        request_transfer:
                          id: 9d5718bb-bd0d-4df4-865c-c07afab8bb5
                          initiator_id: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                    errors:
                      - code: invalid
                        detail: File is too large or wrong content type
                        source:
                          pointer: /supplier_invoices/idempotency_key/abc-xyz/file
                when there are only errors:
                  value:
                    supplier_invoices: []
                    errors:
                      - code: invalid
                        detail: File is too large or wrong content type
                        source:
                          pointer: /supplier_invoices/idempotency_key/abc-xyz/file
                      - code: internal_server_error
                        detail: Processing file has failed
                        source:
                          pointer: /supplier_invoices/idempotency_key/abc-xyz
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - supplier_invoice.write
        - SecretKey: []
  /v2/client_invoices:
    get:
      tags:
        - Client Invoices
      summary: List client invoices
      description: |
        OAuth scope: `client_invoices.read`

        Retrieves the list of client invoices for the authenticated organization.

        You can filter (ex: only retrieve the latest client invoices) and sort this list by using [query parameters](#parameter-filter-status) 👇
      operationId: list_client_invoices
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: filter[status]
          in: query
          description: |-
            Invoices can be filtered by their `status`:
            - `draft`: the invoice was created but not validated. The invoice still needs to be validated to be paid.
            - `unpaid`: the invoice was created and validated. The invoice is ready to be paid.
            - `canceled`: the invoice was created but canceled by the initiator. The invoice it is not ready to be paid.
            - `paid`: the invoice was created, forwarded to the client, and successfully paid.

            To filter by multiple statuses, use a comma-separated list.
          schema:
            type: array
            default: all statuses
            items:
              type: string
              enum:
                - draft
                - unpaid
                - paid
                - canceled
        - name: filter[created_at_from]
          in: query
          description: Invoices can be filtered by their `created_at` property. This filter can be used in combination with the `created_at_to` query parameter to get invoices created within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-02-01T12:01:02Z'
        - name: filter[created_at_to]
          in: query
          description: Invoices can be filtered by their `created_at` property. This filter can be used in combination with the `created_at_from` query parameter to get invoices created within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-04-23T16:23:00Z'
        - name: filter[updated_at_from]
          in: query
          description: Invoices can be filtered by their `updated_at` property. This filter can be used in combination with the `updated_at_to` query parameter to get invoices updated within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-02-01T12:01:02Z'
        - name: filter[updated_at_to]
          in: query
          description: Invoices can be filtered by their `updated_at` property. This filter can be used in combination with the `updated_at_from` query parameter to get invoices updated within a specific timeframe. Please use a valid date time format (ISO 8601 for instance).
          schema:
            type: string
            format: date-time
            example: '2022-04-23T16:23:00Z'
        - name: exclude_imported
          in: query
          description: |
            Controls whether imported invoices should be excluded from the results.
            - `true` (default): Excludes invoices that have been imported.
            - `false`: Includes all invoices, including imported ones.

            **Note**: By default, imported invoices are excluded. To retrieve imported invoices, explicitly set this parameter to `false`.
          schema:
            type: boolean
            default: true
            example: false
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          description: Number of invoices per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            minimum: 100
            default: 1
        - name: sort_by
          in: query
          description: 'Invoices can be sorted by their `created_at` property in 2 possible orders: `asc` (Ascending) / `desc` (Descending).'
          schema:
            type: string
            enum:
              - created_at:desc
              - created_at:asc
            default: created_at:desc
      responses:
        '200':
          description: Returns the list of client invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientInvoice'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 2
                      next_page:
                        type: integer
                        nullable: true
                        example: 'null'
                      prev_page:
                        type: integer
                        nullable: true
                        example: 1
                      total_pages:
                        type: integer
                        example: 2
                      total_count:
                        type: integer
                        example: 150
                      per_page:
                        type: integer
                        example: 100
        '400':
          $ref: '#/components/responses/400-Client-Invoice-Bad-Request'
        '401':
          $ref: '#/components/responses/401-Client-Invoice-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Client-Invoice-Forbidden'
        '422':
          $ref: '#/components/responses/422-Client-Invoice-Unprocessable-Entity'
        '500':
          $ref: '#/components/responses/500-Client-Invoice-Internal-Server-Error'
      security:
        - OAuth:
            - client_invoices.read
        - SecretKey: []
