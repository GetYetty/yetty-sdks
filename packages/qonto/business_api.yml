                        source:
                          pointer: /beneficiaries/1/id
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - payment.write
        - SecretKey: []
  /v2/attachments:
    post:
      tags:
        - Attachments
      summary: Upload an attachment
      description: |-
        OAuth scope: `attachment.write`

        Uploads a single attachment (JPEG, PNG or PDF).

        This operation will enable you to link the uploaded attachement to an external transfer (through [POST /v2/external_transfers](/api-reference/business-api/endpoints/external-transfers/create-an-external-transfer-for-a-trusted-beneficiary) or [POST /v2/external_transfers/checkout](/api-reference/business-api/endpoints/external-transfers/create-external-transfers-with-beneficiaries-data)).

        In the Qonto app, attachments are files uploaded onto transactions by users. Attachments typically correspond to the *invoice* or *receipt*, and are used to justify the transactions from a bookkeeping standpoint.
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
      requestBody:
        description: |-
          You have to specify multipart form data in order to attach the file to the request. When using `curl` it will look like that:

          ```
          curl --request POST \
            --url https://thirdparty.qonto.com/v2/attachments \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: {Auth}" \
            -F file="@path/to/a/file.jpg"
          ```
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            examples:
              default:
                value:
                  file: <% multipart/form-data file data %>
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                file:
                  type: string
            examples:
              default:
                value:
                  file: foobar.png
      responses:
        '200':
          description: Returns the uploaded attachment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    type: object
                    properties:
                      id:
                        type: string
              examples:
                default:
                  value:
                    attachment:
                      id: 71c32755-d0c3-4d82-9a78-774caa9d8556
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '422':
          $ref: '#/components/responses/422-Unprocessable-Entity'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - attachment.write
        - SecretKey: []
  /v2/attachments/{id}:
    get:
      tags:
        - Attachments
      summary: Retrieve an attachment
      description: |
        OAuth scope: `organization.read`

        Retrieves the attachment identified by the `id` path parameter.

        In the Qonto app, attachments are files uploaded onto transactions by users. Attachments typically correspond to the *invoice* or *receipt*, and are used to justify the transactions from a bookkeeping standpoint.

        You can retrieve the IDs of those attachments inside each `transaction` object, by calling [GET /v2/transactions](/api-reference/business-api/transactions-statements/transactions/list-transactions).

        Probative attachment is another version of attachment, compliant with [PAdES](https://en.wikipedia.org/wiki/PAdES) standard.

        <Warning>
          For security reasons, the `url` you retrieve for each attachment is **only valid for 30 minutes**. If you need to download the file after more than 30 minutes, you will need to perform another authenticated call in order to generate a new download URL.
        </Warning>

        <Note>
          If you download the file using `curl`, replace the `\\u0026` references by `&` in the `url` string.
        </Note>
      operationId: get_attachment
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: e72f6e43-0f27-4415-8781-ad648a89b47f
          examples:
            default:
              value: e72f6e43-0f27-4415-8781-ad648a89b47f
      responses:
        '200':
          description: Returns the attachment identified by the `id` path parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    type: object
                    properties:
                      id:
                        type: string
                      created_at:
                        type: string
                      file_name:
                        type: string
                      file_size:
                        type: string
                      file_content_type:
                        type: string
                      url:
                        type: string
                      probative_attachment:
                        type: object
                        properties:
                          status:
                            type: string
                          file_name:
                            type: string
                          file_content_type:
                            type: string
                          file_size:
                            type: string
                          url:
                            type: string
              examples:
                default:
                  value:
                    attachment:
                      id: 71c32755-d0c3-4d82-9a78-774caa9d8556
                      created_at: '2021-03-23T14:21:51.000Z'
                      file_name: Foobar
                      file_size: '666'
                      file_content_type: image/png
                      url: https://my-s3.url.qonto.bucket.com/123456789
                      probative_attachment:
                        status: unavailable
                        file_name: statement.pdf
                        file_content_type: application/pdf
                        file_size: '666'
                        url: https://my-s3.url.qonto.bucket.com/123456789
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
