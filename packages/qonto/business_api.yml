        request_transfer:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
            initiator_id:
              type: string
              format: uuid
              example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
