      description: |
        <Warning>
          This endpoint will be sunsetted on March 31, 2026.
          For SEPA beneficiaries, please use the [Untrust SEPA beneficiaries](/api-reference/business-api/payments-transfers/sepa-transfers/beneficiaries/sepa-beneficiaries/untrust) endpoint instead.
        </Warning>

        OAuth scope: `payment.write`

        Untrusts **up to 400** beneficiaries for the authenticated organization.
      operationId: untrust_beneficiaries
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                    example: 921c60fc-df0e-4289-a864-38a438ad2366
              required:
                - ids
      responses:
        '200':
          description: Returns the untrusted beneficiaries.
          content:
