  /v2/sepa/bulk_transfers:
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    get:
      tags:
        - SEPA Transfers
      summary: List Bulk Transfers
      description: |
        OAuth scope: `organization.read`

        Retrieves a list of all SEPA Bulk transfers. The list is ordered by `updated_at` in descending order.
