      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                internal_transfer:
                  type: object
                  properties:
                    debit_iban:
                      type: string
                      description: IBAN of account to debit.
                    credit_iban:
                      type: string
                      description: IBAN of account to credit.
                    reference:
                      type: string
                      description: Can be used to enter transfer details to further describe the transfer. Maximum `reference` length is `99` characters.
                    amount:
                      type: string
                      description: Corresponds to the amount of the transaction in the `currency` of the bank account. Amounts must  be https://www.w3.org/TR/payment-request/#dfn-valid-decimal-monetary-value.
                    currency:
                      type: string
