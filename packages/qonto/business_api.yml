  /v2/sca_sessions/{sca-session-token}:
    get:
      summary: Retrieve SCA session
      tags:
        - SCA
      description: |-
        Retrieves the SCA session identified by the `sca_session_token` path parameter.

        This endpoint should be called during the [Paired device flow](/api-reference/business-api/authentication/sca/sca-flows#paired-device-flow) or the [Passkey flow](/api-reference/business-api/authentication/sca/sca-flows#passkey-flow).

        If you want to test a sensitive action on the Sandbox environment, opt for our [Mock option](/api-reference/business-api/authentication/sca/sca-flows#using-the-mock-option) (much simpler) instead of simulating SCA on our Sandbox mobile app (available in the [Developer Portal toolkit](https://developers.qonto.com/toolkit/)).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: sca_session_token
          description: Token retrieved when initiating a sensitive action. This token is only valid for **15 minutes**.
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the SCA session identified by the `sca_session_token` path parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: |-
                      Available options:
                      - `waiting`: if the user has not authorized the action yet;
                      - `deny`: if the user refused the action (or more than 15 minutes passed);
                      - `allow`: if the user has authorised the action.
                    example: waiting
                  canceled_at:
                    type: string
                    example: ''
                required:
                  - result
                  - canceled_at
              example:
                result: waiting
                canceled_at: ''
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v2/mocked_sca_sessions/{sca-session-token}:
    servers:
      - url: https://thirdparty-sandbox.staging.qonto.co
        description: Mock URL
    get:
      summary: Retrieve mocked SCA session
      tags:
        - SCA
      description: |-
        Retrieves the **mocked** SCA session identified by the `sca_session_token` path parameter.

        This endpoint should be called when [testing a sensitive action on the Sandbox environment](/api-reference/business-api/authentication/sca/sca-flows#testing-a-sensitive-action-on-the-sandbox-environment).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: sca_session_token
          description: Token retrieved when initiating a sensitive action. This token is only valid for **15 minutes**.
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the mocked SCA session identified by the `sca_session_token` path parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: |-
                      Available options:
                      - `waiting`: if the user has not authorized the action yet;
                      - `deny`: if the user refused the action (or more than 15 minutes passed);
                      - `allow`: if the user has authorised the action.
                    example: waiting
                  canceled_at:
                    type: string
                    nullable: true
                    example: null
                required:
                  - result
                  - canceled_at
              example:
                result: waiting
                canceled_at: null
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v2/mocked_sca_sessions/{sca-session-token}/{decision}:
    servers:
      - url: https://thirdparty-sandbox.staging.qonto.co
        description: Mock URL
    post:
      summary: Simulate user decision
      tags:
        - SCA
      description: |-
        Simulates user decision for the **mocked** SCA session identified by the `sca_session_token` path parameter.

        This endpoint should be called when [testing a sensitive action in the Sandbox environment](/api-reference/business-api/authentication/sca/sca-flows#testing-a-sensitive-action-on-the-sandbox-environment).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: sca_session_token
          description: Token retrieved when initiating a sensitive action. This token is only valid for **15 minutes**.
          in: path
          required: true
          schema:
            type: string
        - name: decision
          in: path
          required: true
          schema:
            type: string
          description: |-
            - `allow` to allow the action;
            - `deny` to deny the action.
      responses:
        '200':
          description: Returns the result of the simulation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                required:
                  - message
              example:
                message: Success
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
