  /v2/transactions/{id}/attachments:
    post:
      tags:
        - Attachments
      summary: Upload an attachment to a transaction
      description: |-
        OAuth scope: `attachment.write`

        Uploads a single attachment (JPEG, PNG or PDF) to the transaction identified by the `id` path parameter.

        In the Qonto app, attachments are files uploaded onto transactions by users. Attachments typically correspond to the *invoice* or *receipt*, and are used to justify the transactions from a bookkeeping standpoint.

        <Info>
          The uploaded file will be processed in the background. This means that the created attachment will not be visible immediately.
        </Info>
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 2751a41c-c17f-43f7-bd18-04efa6cd8e30
          examples:
            default:
              value: 2751a41c-c17f-43f7-bd18-04efa6cd8e30
      requestBody:
        description: |-
          You have to specify multipart form data in order to attach the file to the request. When using `curl` it will look like that:

          ```
          curl --request POST \
            --url https://thirdparty.qonto.com/v2/transactions/{id}/attachments \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: {Auth}" \
            -F file="@path/to/a/file.jpg"
          ```
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            examples:
              example:
                value:
                  file: <% multipart/form-data file data %>
      responses:
        '200':
          description: Accepts the file and returns a success status code.
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          description: Returns a not found error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/NotFoundError'
                x-examples:
                  Example 1:
                    errors:
                      - code: not_found
                        detail: Transaction not found
                        source:
                          parameter: id
              examples:
                id not found:
                  value:
                    errors:
                      - code: not_found
                        detail: Transaction not found
                        source:
                          parameter: id
        '422':
          $ref: '#/components/responses/422-Unprocessable-Entity'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - attachment.write
        - SecretKey: []
    get:
      tags:
        - Attachments in Transactions
      summary: List attachments for a transaction
      description: |
        OAuth scope: `organization.read`

        Retrieves all the attachments for the transaction identified by the `id` path parameter.

        In the Qonto app, attachments are files uploaded onto transactions by users. Attachments typically correspond to the *invoice* or *receipt*, and are used to justify the transactions from a bookkeeping standpoint.

        You can retrieve the IDs of those attachments inside each `transaction` object, by calling [GET /v2/transactions](/api-reference/business-api/transactions-statements/transactions/list-transactions).

        Probative attachment is another version of attachment, compliant with [PAdES](https://en.wikipedia.org/wiki/PAdES) standard.

        <Warning>
          For security reasons, the `url` you retrieve for each attachment is **only valid for 30 minutes**. If you need to download the file after more than 30 minutes, you will need to perform another authenticated call in order to generate a new download URL.
        </Warning>

        <Note>
          If you download the file using `curl`, replace the `\\u0026` references by `&` in the `url` string.
        </Note>
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
        - name: per_page
          in: query
          description: Number of attachments per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: aab86d8a-0d4c-4749-9a49-0ada88a9c423
          examples:
            default:
              value: aab86d8a-0d4c-4749-9a49-0ada88a9c423
      responses:
        '200':
          description: Returns the list of attachments for the transaction identified by the `id` path parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                        created_at:
                          type: string
                        file_name:
                          type: string
                        file_size:
                          type: string
                        file_content_type:
                          type: string
                        url:
                          type: string
                        probative_attachment:
                          type: object
                          properties:
                            status:
                              type: string
                            file_name:
                              type: string
                            file_content_type:
                              type: string
                            file_size:
                              type: string
                            url:
                              type: string
              examples:
                default:
                  value:
                    attachments:
                      - id: 9b048e2c-d546-415b-b001-d31a6d4ae1e3
                        created_at: '2021-01-27T22:05:07.000Z'
                        file_name: Foobar
                        file_size: '666'
                        file_content_type: image/png
                        url: https://my-s3.url.qonto.bucket.com/123456789
                        probative_attachment:
                          status: available
                          file_name: statement.pdf
                          file_content_type: application/pdf
                          file_size: '123'
                          url: https://my-s3.url.qonto.bucket.com/123456789
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          description: Returns a not found error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/NotFoundError'
                x-examples:
                  Example 1:
                    errors:
                      - code: not_found
                        detail: Transaction not found
                        source:
                          parameter: id
              examples:
                id not found:
                  value:
                    errors:
                      - code: not_found
                        detail: Transaction not found
                        source:
                          parameter: id
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
