      allOf:
        - $ref: '#/components/schemas/PaymentLinkConnection'
    PaymentLink:
      type: object
      required:
        - id
        - status
        - expiration_date
        - potential_payment_methods
        - amount
        - items
        - reusable
        - created_at
        - url
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the payment link.
        status:
          type: string
          description: The status of the payment link.
          enum:
            - open
            - expired
            - canceled
            - paid
            - processing
          example: open
        expiration_date:
          type: string
          format: date-time
          description: The date and time when the payment link will expire, formatted as an ISO 8601 date-time string.
          example: '2021-01-01T00:00:00Z'
        potential_payment_methods:
          type: array
          items:
            type: string
            enum:
              - credit_card
              - apple_pay
              - paypal
              - ideal
            example: credit_card
        amount:
          type: object
          description: The gross amount of the payment link, including VAT.
          required:
            - value
            - currency
          properties:
            value:
              type: string
              description: The amount of the payment link, formatted as a decimal string.
              example: '13.30'
            currency:
              type: string
              description: The currency of the payment link, formatted as an ISO 4217 currency code.
              example: EUR
        items:
          type: array
          items:
            type: object
            required:
              - title
              - quantity
              - unit_price
              - vat_rate
            properties:
              title:
                type: string
                description: The title of the item.
                example: Item 1
              type:
                type: string
                description: The type of the item.
                enum:
                  - good
                  - service
                example: good
              description:
                type: string
                description: The description of the item.
                example: Item 1 description
              quantity:
                type: number
                format: double
                description: The quantity of the item.
                example: 1
              measure_unit:
                type: string
                description: The unit of measure of the item.
                example: unit
              unit_price:
                type: object
                required:
                  - value
                  - currency
                properties:
                  value:
                    type: string
                    description: The amount of the item.
                    example: '10.99'
                  currency:
                    type: string
                    description: The currency of the item, formatted as an ISO 4217 currency code.
                    example: EUR
              vat_rate:
                type: string
                description: The VAT rate of the item, formatted as a decimal string.
                example: '21.0'
        reusable:
          type: boolean
          description: Whether the payment link can be reused.
          example: true
        created_at:
          type: string
          format: date-time
          description: The date and time when the payment link was created, formatted as an ISO 8601 date-time string.
          example: '2021-01-01T00:00:00Z'
        url:
          type: string
          description: The URL of the payment link.
          example: https://pay.qonto.com/019788b3-57ab-727c-b26e-86b95c16e93f?resource_id=4c56f862-6117-4b20-a3e3-7fa6fccea029
    ListPaymentLinksResponse:
      type: object
      required:
        - payment_links
        - meta
