    TransactionDataV1:
      title: v1/transaction
      type: object
      required:
        - event
        - id
        - transaction_id
        - amount
        - currency
        - local_amount
        - local_currency
        - side
        - operation_type
        - status
        - label
        - clean_counterparty_name
        - emitted_at
        - updated_at
        - attachment_ids
        - subject_type
        - bank_account
      properties:
        event:
          type: string
          enum:
            - created
            - updated
          description: Event triggering the webhook
          example: created
        id:
          type: string
          format: uuid
          description: Unique identifier for the transaction
          example: 123e4567-e89b-12d3-a456-426614174000
        transaction_id:
          type: string
          description: Unique identifier of the transaction
          example: super-transaction-6576
        amount:
          type: number
          description: Positive transaction amount as string, with a period as decimal separator and N decimal places (related to currency).
          example: 50
        currency:
          type: string
          description: Transaction currency (ISO 4217)
          example: EUR
        local_amount:
          type: number
          description: Positive amount of the transaction in the foreign currency (if any) as string, with a period as decimal separator and N decimal places (related to currency)
          example: 45
        local_currency:
          type: string
          description: Local currency code (ISO 4217)
          example: USD
        side:
          type: string
          enum:
            - credit
            - debit
          description: Transaction direction
          example: debit
        settled_balance:
          type: number
          description: Positive settled balance as string, with a period as decimal separator and N decimal places (related to currency)
          example: 100
        operation_type:
          type: string
          description: Type of the transaction
          example: card
        status:
          type: string
          description: Current status of the transaction
          example: completed
        label:
          type: string
          description: Name of the counterparty of the transaction
          example: ACME Corp
        clean_counterparty_name:
          type: string
          description: Simplified and standardized version of the counterparty's name.
          example: ACME Corp
        note:
          type: string
          description: User provided note for the transaction
          example: Business lunch
        reference:
          type: string
          description: Reference of the transaction
          example: INV-1234
        settled_at:
          type: string
          format: date-time
          description: When the transaction was settled
          example: '2025-01-24T10:54:00Z'
        emitted_at:
          type: string
          format: date-time
          description: When the transaction was initiated
          example: '2025-01-24T10:54:00Z'
        updated_at:
          type: string
          format: date-time
          description: When the transaction was last updated
          example: '2025-01-24T10:55:00Z'
        attachment_ids:
          type: array
          items:
            type: string
          description: List of attachment IDs associated with the transaction
        subject_type:
          type: string
          enum:
            - Card
            - Transfer
            - Income
            - DirectDebit
            - DirectDebitCollection
            - DirectDebitHold
            - WalletToWallet
            - Check
            - SwiftIncome
            - PagopaPayment
            - F24Payment
            - BillingTransfer
            - FinancingIncome
            - FinancingInstallment
            - Other
          description: Type of the transaction that determines which additional fields will be present
        card_last_digits:
          type: string
          description: Last 4 digits of the card used for the transaction
        bank_account:
          type: object
          required:
            - id
            - iban
            - bic
            - name
          properties:
            id:
              type: string
              format: uuid
              description: Bank account identifier
              example: 123e4567-e89b-12d3-a456-426614174000
            iban:
              type: string
              description: Bank account IBAN
              example: FR7616798000010000005663951
            bic:
              type: string
              description: Bank account BIC
              example: TRZOFR21XXX
            name:
              type: string
              description: Name of the bank account
              example: Main Account
        transfer:
          $ref: '#/components/schemas/CounterpartyAccount'
        income:
          $ref: '#/components/schemas/CounterpartyAccount'
        swift_income:
          $ref: '#/components/schemas/CounterpartyAccount'
        direct_debit:
          $ref: '#/components/schemas/CounterpartyAccount'
        direct_debit_collection:
          $ref: '#/components/schemas/CounterpartyAccount'
        check:
          type: object
          required:
            - check_number
            - check_key
          properties:
            check_number:
              type: string
              description: Check number
            check_key:
              type: string
              description: Check key
        financing_installment:
          type: object
          required:
            - total_installments_number
            - current_installment_number
          properties:
            total_installments_number:
              type: integer
              description: Total number of installments
            current_installment_number:
              type: integer
              description: Installment of the current transaction
        pagopa_payment:
          type: object
          required:
            - notice_number
            - creditor_fiscal_code
            - iuv
          properties:
            notice_number:
              type: string
              description: Code in the PagoPA Payment Advice that identifies the payment notice
            creditor_fiscal_code:
              type: string
              description: Code that identifies the creditor institution
            iuv:
              type: string
              description: Unique Payment Identifier (UPI)
        direct_debit_hold:
          type: object
          required:
            - guarding_rate
          properties:
            guarding_rate:
              type: string
              description: Guarding rate for the direct debit hold
