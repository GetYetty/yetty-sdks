            post_authn_action:
              type: string
              enum:
                - create_payment_link
              description: |
                Specifies where the user is redirected on the Hosted Page following authentication.

                - `create_payment_link`: The user will be redirected to the payment link creation flow.
            callback_url:
              type: string
              format: uri
              example: https://your-website.com/callback
              description: |
                The URL to which the user will be redirected upon completion of the action.

                A valid callback URL must:
                - Use the HTTPS scheme
                - Include a valid public top-level domain (TLD)

                The following are also permitted:
                - Subdomains
                - Explicit custom ports (e.g., 8080)
                - Path segments, query parameters, and fragments
