          type: string
          format: date
          description: Expiry date in YYYY-MM-DD format
          example: '2024-02-15'
        number:
          type: string
          description: |-
            Quote's number. Must be unique within the organization and is:
            - **required** if automatic numbering is disabled for the authenticated organization (default setting);
            - **optional** if automatic numbering is enabled for the authenticated organization.
              However, if provided, it will be used as the quote's number.
          example: Q-2024-001
          maxLength: 40
        terms_and_conditions:
          type: string
          description: Terms and conditions text
          maxLength: 3000
        currency:
          type: string
          description: Currency code (ISO 4217, alpha 3)
          example: EUR
        header:
          type: string
          description: Optional header text for the quote.
          maxLength: 1000
        footer:
          type: string
          description: Optional footer text for the quote.
          maxLength: 1000
        settings:
          type: object
          description: This collection of propertys can be optionally used to temporarily override some of the organization's properties for this one invoice.
          properties:
            vat_number:
              type: string
              description: VAT number
            district_court:
              type: string
              description: District court (German specific)
            company_leadership:
              type: string
              description: Company leadership info
            commercial_register_number:
              type: string
              description: Commercial register number
            tax_number:
              type: string
              description: Tax number
        discount:
          type: object
          description: Global discount applied to the quote
          properties:
            type:
              type: string
              enum:
                - percentage
                - amount
              description: Discount type
              example: percentage
            value:
              type: string
              description: Discount value (percentage as decimal or amount)
              example: '10'
        items:
          type: array
          description: Quote's line items
          minItems: 1
          items:
            type: object
            required:
              - title
              - currency
              - quantity
              - unit_price
              - vat_rate
            properties:
              title:
                type: string
                description: Item title
                maxLength: 255
              description:
                type: string
                description: Item description
                maxLength: 1800
              currency:
                type: string
                description: Currency code (must match quote currency), ISO 4217 format alpha 3
                example: EUR
              quantity:
                type: string
                description: Quantity (decimal number as string)
                example: '2.5'
              unit:
                type: string
                description: Unit of measurement
                maxLength: 50
                example: hour
              unit_price:
                type: object
                required:
                  - value
                  - currency
                properties:
                  value:
                    type: string
                    description: Unit price value
                    example: '100.00'
                  currency:
                    type: string
                    description: Currency code (ISO 4217, alpha 3)
                    example: EUR
              vat_rate:
                type: string
                description: VAT rate (percentage as decimal, e.g., "20" for 20%)
                example: '20'
              discount:
                type: object
                description: Item-level discount
                properties:
                  type:
                    type: string
                    enum:
                      - percentage
                      - amount
                    description: Discount type
                  value:
                    type: string
                    description: Discount value
                    example: '5'
              vat_exemption_reason:
                type: string
                description: VAT exemption code (Italian specific)
                example: N1
        welfare_fund:
          type: object
          description: Welfare fund details (Italian specific)
          properties:
            type:
              type: string
              description: Welfare fund type
              example: TC22
            rate:
              type: string
              description: Welfare fund rate as decimal
              example: '0.1'
        withholding_tax:
          type: object
