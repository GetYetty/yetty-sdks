                    type: array
                    items:
                      $ref: '#/components/schemas/CreditNote'
                  meta:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - credit_notes
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
