  /v2/sepa/verify_payee:
    post:
      tags:
        - SEPA Transfers
      summary: Verify a SEPA payee
      description: |
        OAuth scope: `payment.write`

        Verifies payee information by matching IBAN and beneficiary name for internal and external accounts.
        Returns a match result indicating whether the provided information matches
        the account holder's details. In the case of close matches, the matched name is returned.

        <Tip>
          You can also use the [Sandbox environment](/api-reference/business-api/payments-transfers/sepa-transfers/introduction#testing-with-sandbox) to test the endpoint with mocked IBANs.
        </Tip>
      operationId: verifyPayee
      security:
        - OAuth:
            - payment.write
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - iban
                - beneficiary_name
              properties:
                iban:
                  type: string
                  description: IBAN of the beneficiary account to be verified
                  example: FR7610002006000000141790000
                  pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{7}([A-Z0-9]?){0,16}$
                beneficiary_name:
                  type: string
                  description: Name of the beneficiary to verify against the account
                  example: John Doe
                  minLength: 1
                  maxLength: 140
            examples:
              basic_verification:
                summary: Basic payee verification
                value:
                  iban: FR7610002006000000141790000
                  beneficiary_name: Default Match Person
      responses:
        '200':
          description: Verification completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  match_result:
                    type: string
                    description: Result of the payee verification
                    enum:
                      - MATCH_RESULT_MATCH
                      - MATCH_RESULT_NO_MATCH
                      - MATCH_RESULT_CLOSE_MATCH
                      - MATCH_RESULT_NOT_POSSIBLE
                      - MATCH_RESULT_UNSPECIFIED
                    example: MATCH_RESULT_MATCH
                  matched_name:
                    type: string
                    description: The actual name associated with the account (present for close matches)
                    example: Jon Jones
                    nullable: true
                  proof_token:
                    type: object
                    description: Token representing proof of a verification attempt. This token is valid for 23 hours to initiate a transfer. This limit might change depending on further security considerations.
                    properties:
                      token:
                        type: string
                        description: The proof token value. This token is valid for 23 hours to initiate a transfer. This limit might change depending on further security considerations.
                        example: proof_1234567890abcdef
                    required:
                      - token
              examples:
                match_result:
                  summary: Exact match found
                  value:
                    match_result: MATCH_RESULT_MATCH
                    proof_token:
                      token: proof_1234567890abcdef
                close_match_result:
                  summary: Close match found
                  value:
                    match_result: MATCH_RESULT_CLOSE_MATCH
                    matched_name: Jon Jones
                    proof_token:
                      token: proof_1234567890abcdef
                no_match_result:
                  summary: No match found
                  value:
                    match_result: MATCH_RESULT_NO_MATCH
                    proof_token:
                      token: proof_1234567890abcdef
                not_possible_result:
                  summary: |
                    The match result is not possible due to some error or condition.
                    This could happen if the responding PSP does not support name verification, or if it could not confirm
                    or deny the match for any reason.
                  value:
                    match_result: MATCH_RESULT_NOT_POSSIBLE
                    proof_token:
                      token: proof_1234567890abcdef
