          example: '2022-03-01'
        due_date:
          type: string
          example: '2022-03-01'
        payment_date:
          type: string
          example: '2022-03-01'
        scheduled_date:
          type: string
          example: '2022-03-01'
        status:
          $ref: '#/components/schemas/SupplierInvoiceStatus'
        iban:
          type: string
          example: FR1420041010050500013M02606
        initiator_id:
          type: string
          format: uuid
        source_type:
          type: string
          example: email
          enum:
            - email
            - e_invoicing
            - direct_upload
        source:
          type: string
          example: email_forward
          enum:
            - email_forward
            - e_invoicing
            - supplier_invoices
            - pay_by_invoice
            - integration
            - regate
            - generic_upload
            - pay_later
        created_at:
          type: string
          example: '2022-03-04T17:58:30+02:00'
        updated_at:
          type: string
          example: '2022-03-04T17:58:30+02:00'
        attachment_id:
          type: string
          format: uuid
        display_attachment_id:
          type: string
          format: uuid
        is_attachment_invoice:
