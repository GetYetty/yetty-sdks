  /v2/external_transfers/checkout:
    post:
      tags:
        - External Transfers (deprecated)
      deprecated: true
      summary: Create external transfers with beneficiaries data
      description: |
        OAuth scope: `payment.write`

        This operation requires [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).

        <Note>
          Example of SCA usage: [Postman visual flow](https://www.postman.com/qontoteam/workspace/qonto-public-api/flow/6670429eb7bd63003156bd57)
        </Note>

        <Warning>
          This endpoint will be sunsetted on March 31, 2026.
          For SEPA transfers, please use the [Create a SEPA Bulk Transfer](/api-reference/business-api/payments-transfers/sepa-transfers/sepa-bulk-transfers/create) endpoint instead.
          The new endpoint works for both trusted and untrusted beneficiaries.
        </Warning>


        **Solo basic plans**

        - Creates a single external transfer with beneficiary data.
        - Solo basic plans are not allowed to do bulk transfers. If a bulk transfer is attempted, it will fail and an error will be returned.

        **Rest of plans**

        Creates **up to 400** external transfers with beneficiaries data.

        Business rules and validations are applied to each individual transfer synchronously. For instance, transfers above 30,000 EUR require at least one attachment. This validation is performed synchronously so, if the attachment is missing for one transfer, an error will be sent for that transfer (cf. [response payload](#response-errors)) but **the other tranfers will be initiated normally**.

        By default, transfers will be processed as **instant**. If instant processing isn't possible, it will automatically fall back to standard processing. It will be the case if the amount of the individual transfer is above the following thresholds 👇
          <AccordionGroup>
            <Accordion title="Untrusted beneficiary">
              - The individual transfer is above 5,000 EUR;
              - More than 20,000 EUR have been sent to this beneficairy within 24 hours.
            </Accordion>
            <Accordion title="Trusted beneficiary">
              - The individual transfer is above 10,000 EUR;
              - More than 50,000 EUR have been sent to this beneficairy within 24 hours.
            </Accordion>
          </AccordionGroup>

        To learn more about instant transfers, please read [this article](https://support-fr.qonto.com/hc/en-us/articles/23947629441681-How-to-make-an-instant-transfer-in-euros-SEPA).

        <Warning>
          This endpoint requires user interaction for approval of the external transfers. If you want to fully automate external transfers, check our [POST /v2/external_transfers](/api-reference/business-api/payments-transfers/external-transfers/create-an-external-transfer-for-a-trusted-beneficiary) endpoint.
        </Warning>
      operationId: external_transfers_checkout
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vop_proof_token:
                  type: string
                  description: Proof token from a bulk payee verification attempt or skip verification request. Use the token from [bulk verify payee](/api-reference/business-api/payments-transfers/sepa-transfers/verify-payee/bulk-verify-payee#tag/Bulk-Verify-SEPA-Payee/operation/bulkVerifyPayee) or [skip verify payee](/api-reference/business-api/payments-transfers/sepa-transfers/verify-payee/skip-verify-payee#tag/Skip-Verify-SEPA-Payee/operation/skipVerifyPayee) to opt-out from the verification.
                  example: proof_1234567890abcdef
                debit_iban:
                  type: string
                  description: IBAN of account to debit.
                external_transfers:
                  type: array
                  items:
                    type: object
                    properties:
                      credit_iban:
                        type: string
                        description: IBAN of account to credit.
                      credit_account_name:
                        type: string
                        description: The name of the credit account.
                      credit_account_currency:
                        type: string
                        description: Can be either the currency of the `debit_iban` or the currency of the creditor. Allowed values is only `EUR` at the moment.
                      reference:
                        type: string
                        description: Transfer reference that can be used to enter transfer details to further describe the transfer. Maximum `reference` length is `140` characters.
                      note:
                        type: string
                      currency:
                        type: string
                        description: Allowed values is only `EUR` at the moment.
                      scheduled_date:
                        type: string
                        example: '2021-07-12'
                        description: The transfers will be executed on the `scheduled_date` (YYYY-MM-DD) at midnight (GMT).
                        default: Current date or next banking day
                      amount:
                        type: string
                        description: Corresponds to the amount of the transaction in the `currency` of the bank account. Amounts must be https://www.w3.org/TR/payment-request/#dfn-valid-decimal-monetary-value.
                      idempotency_key:
                        type: string
                        description: |-
                          This is a unique string (we advise to use a `uuid`) that identifies a transfer. This is used by Qonto to prevent "double spending" by accidentaly replaying the same API call.

                          The `idempotency_key` must be the same for all the call sequence used during the SCA flow :

                          - For each transfer, the `idempotency_key` is first set on the initial call, which will trigger the SCA flow.
                          - The **same** `idempotency_key` **must** be used on the final call that includes the SCA token.

                          This is so because the two calls are actually related to the **same transfer**.
                        format: uuid
                      attachment_ids:
                        type: array
                        description: |
                          You can link up to 5 attachments per transfer by passing the `attachment_ids` parameter. You can upload your attachments using our [POST /v2/attachments](/api-reference/business-api/endpoints/attachments/upload-an-attachment) endpoint.
                          <br>**Note: For SEPA transfers above 30,000 EUR at least one attachment is required**
                        items:
                          type: string
                          format: uuid
                    required:
                      - credit_iban
                      - credit_account_name
                      - credit_account_currency
                      - reference
                      - currency
                      - amount
              required:
                - debit_iban
                - external_transfers
                - vop_proof_token
      responses:
        '200':
          description: Returns the external transfers created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalTransfer'
                  errors:
                    description: Detailed errors for each failing transfer in the job.
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                      required:
                        - code
                required:
                  - external_transfers
                  - errors
              examples:
                only successes:
                  value:
                    external_transfers:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        slug: my-slug
                        debit_iban: string
                        debit_amount: '12.55'
                        debit_amount_cents: '1255'
                        debit_currency: EUR
                        initiator_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        beneficiary_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        credit_amount: '12.55'
                        credit_amount_cents: '1255'
                        credit_currency: EUR
                        rate_applied: null
                        payment_purpose: goods
                        reference: my-reference
                        note: Some note
                        declined_reason: null
                        status: pending
                        scheduled_date: '2021-07-12'
                        created_at: '2021-01-27T22:05:07.000Z'
                        completed_at: '2021-01-27T22:05:07.000Z'
                        processed_at: '2021-01-27T22:05:07.000Z'
                        transaction_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    errors: []
                partial successes and errors:
                  value:
                    external_transfers:
                      - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        slug: my-slug
                        debit_iban: string
                        debit_amount: '12.55'
                        debit_amount_cents: '1255'
                        debit_currency: EUR
                        initiator_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        beneficiary_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        credit_amount: '12.55'
                        credit_amount_cents: '1255'
                        credit_currency: EUR
                        rate_applied: null
                        payment_purpose: goods
                        reference: my-reference
                        note: Some note
                        declined_reason: null
                        status: pending
                        scheduled_date: '2021-07-12'
                        created_at: '2021-01-27T22:05:07.000Z'
                        completed_at: '2021-01-27T22:05:07.000Z'
                        processed_at: '2021-01-27T22:05:07.000Z'
                        transaction_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    errors:
                      - code: not_found
                        detail: Bank account was not found
                        source:
                          properties:
                            pointer: /external_transfers/1/debit_iban
                only errors:
                  value:
                    external_transfers: []
                    errors:
                      - code: not_found
                        detail: Bank account was not found
                        source:
                          properties:
                            pointer: /external_transfers/1/debit_iban
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '422':
          description: Returns an unprocessable entity error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/UnprocessableEntityError'
                x-examples:
                  Example 1:
                    errors:
                      - code: not_found
                        detail: Bank account was not found
                        source:
                          properties:
                            pointer: /debit_iban
              examples:
                Invalid IBAN:
                  value:
                    errors:
                      - code: not_found
                        detail: Bank account was not found
                        source:
                          properties:
                            pointer: /debit_iban
                invalid or missing vop proof token:
                  value:
                    errors:
                      - code: invalid_vop_proof_token
                        detail: vop_proof_token is required and must be valid
                        source:
                          pointer: /vop_proof_token
        '428':
          $ref: '#/components/responses/428-Precondition-required'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - payment.write
