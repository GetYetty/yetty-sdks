              example: RT01
            rate:
              type: string
              description: Withholding tax rate as decimal
              example: '0.1'
            payment_reason:
              type: string
              description: Payment reason code
              example: M1
        stamp_duty_amount:
          type: string
          description: Stamp duty amount (Italian specific)
          example: '0.1'
