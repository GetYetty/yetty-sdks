                represent the street address section of the delivery address of the client. (eg street, number, floor, door, etc)
              maxLength: 250
              example: 123 Main Street
            city:
              type: string
              description: City on the delivery address of the client that needs to pay the invoice
              maxLength: 50
              example: Paris
            zip_code:
              type: string
              description: Zip code on the delivery address of the client that needs to pay the invoice
              maxLength: 20
              example: '75009'
            province_code:
              type: string
              description: Province code of the client's delivery address that needs to pay the invoice
              maxLength: 2
            country_code:
              type: string
              description: Country code on the delivery address of the client that needs to pay the invoice
              maxLength: 2
              example: fr
        recipient_code:
          type: string
          description: Only for italian clients. Represents the client’s recipient code for receiving an the e-invoice in his SdI portal.
        created_at:
          type: string
          description: Date the client was created. Note that this is a machine date.
