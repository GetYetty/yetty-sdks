      security:
        - OAuth:
            - payment.write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the SEPA recurring transfer
      responses:
        '204':
          description: SEPA recurring transfer successfully cancelled
          content:
            application/json:
              schema:
                type: object
                required:
                  - recurring_transfer
                properties:
                  recurring_transfer:
                    $ref: '#/components/schemas/SepaRecurringTransfer'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                when recurring transfer cannot be cancelled:
                  value:
                    errors:
                      - code: cannot_cancel
                        detail: The recurring transfer cannot be cancelled
                        source:
                          parameter: id
        '401':
          description: Unauthorized
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          description: Forbidden
          $ref: '#/components/responses/403-Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Not-Found'
              examples:
                not_found:
                  value:
                    errors:
                      - code: not_found
                        detail: Recurring transfer not found
                        source:
                          parameter: id
  /v2/sepa/recurring_transfers/{id}:
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    get:
      tags:
        - SEPA Transfers
      summary: Get SEPA recurring transfer
      description: |
        OAuth scope: `organization.read`

        Retrieves a specific SEPA recurring transfer by ID.
      operationId: getSepaRecurringTransfer
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the SEPA recurring transfer
      responses:
        '200':
          description: SEPA recurring transfer retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - recurring_transfer
                properties:
                  recurring_transfer:
                    $ref: '#/components/schemas/SepaRecurringTransfer'
        '401':
          description: Unauthorized
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          description: Forbidden
          $ref: '#/components/responses/403-Forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404-Not-Found'
              examples:
                not_found:
                  value:
                    errors:
                      - code: not_found
                        detail: SEPA recurring transfer not found
                        source:
                          parameter: id
  /v2/sepa/recurring_transfers:
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    get:
      tags:
        - SEPA Transfers
      summary: List SEPA recurring transfers
      description: |
        OAuth scope: `organization.read`

        Retrieves a list of all SEPA recurring transfers. The list is ordered by updated_at in descending order.
      operationId: listSepaRecurringTransfers
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
      parameters:
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
      responses:
        '200':
          description: List of SEPA recurring transfers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - recurring_transfers
                  - meta
                properties:
                  recurring_transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/SepaRecurringTransfer'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          description: Forbidden
          $ref: '#/components/responses/403-Forbidden'
    post:
      tags:
        - SEPA Transfers
      summary: Create a SEPA recurring transfer
      description: |
        OAuth scope: `payment.write`

        This operation requires [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).

        <Note>
          Example of SCA usage: [Postman visual flow](https://www.postman.com/qontoteam/workspace/qonto-public-api/flow/6670429eb7bd63003156bd57)
        </Note>

        Creates a new SEPA recurring transfer for a beneficiary. You can either provide a `beneficiary_id` for a known beneficiary or `beneficiary` data which will create an untrusted beneficiary on the fly.

        **Note**:
        - if a beneficiary with the same IBAN already exists, the provided details (such as name) will be updated;
        - this endpoint is not trusting the beneficiary - you can trust a beneficiary through the Qonto app (for more details, please refer to [this article](https://support-de.qonto.com/hc/en-us/articles/23949206250641-How-can-I-mark-a-payee-as-trustworthy#h_925061f25d)) or through [this endpoint](/api-reference/business-api/payments-transfers/sepa-transfers/beneficiaries/sepa-beneficiaries/trust) (available for Embed partners only).

        The subsequent transfer will be executed according to the specified frequency between the first and last execution dates. If no last execution date is provided the transfer will be executed indefinitely.

        For recurring transfers above 30,000 EUR, at least one attachment is required.
      operationId: createSepaRecurringTransfer
      security:
        - OAuth:
            - payment.write
      parameters:
        - $ref: '#/components/parameters/X-Qonto-2fa-Preference'
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
        - $ref: '#/components/parameters/X-Qonto-Sca-Session-Token'
        - $ref: '#/components/parameters/X-Qonto-MFA'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSepaRecurringTransferRequest'
            examples:
              valid:
                value:
                  vop_proof_token: proof_1234567890abcdef
                  recurring_transfer:
                    beneficiary_id: 66b7e300-0126-4905-9688-27b445a48c4e
                    bank_account_id: 420e13ac-9d3e-4c11-93a1-0c3c8304f2df
                    reference: Lease payment
                    amount: '1100.50'
                    frequency: monthly
                    first_execution_date: '2025-04-22'
                    last_execution_date: '2026-08-21'
                    note: Lease payment for offices in Paris
                    attachment_ids:
                      - 394f77f1-0d2c-46fb-8a7e-a959dbdeee63
      responses:
        '200':
          description: SEPA recurring transfer created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - recurring_transfer
                properties:
                  recurring_transfer:
                    $ref: '#/components/schemas/SepaRecurringTransfer'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                with invalid dates:
                  value:
                    errors:
                      - code: invalid_date_after_reference
                        detail: first_execution_date must be before last_execution_date
                        source:
                          pointer: /recurring_transfer/first_execution_date
                with invalid amount:
                  value:
                    errors:
                      - code: invalid
                        detail: amount must be greater than 0
                        source:
                          pointer: /recurring_transfer/amount
                with recurring transfer amount above 30000 EUR:
                  value:
                    errors:
                      - code: attachment_required
                        detail: The recurring transfer must have at least one attachment
                        source:
                          pointer: /recurring_transfer/attachment_ids
                with unknown beneficiary:
                  value:
                    errors:
                      - code: beneficiary_not_found
                        detail: Beneficiary with id=66b7e300-0126-4905-9688-27b445a48c4e not found
                        source:
                          pointer: /recurring_transfer/beneficiary_id
                with unknown bank account:
                  value:
                    errors:
                      - code: bank_account_not_found
                        detail: BankAccount with id=420e13ac-9d3e-4c11-93a1-0c3c8304f2df not found
                        source:
                          pointer: /recurring_transfer/bank_account_id
                with an internal transfer:
                  value:
                    errors:
                      - code: transfer_to_same_organization
                        detail: The beneficiary bank account belongs to the same organization. Please use our internal transfers endpoints instead.
                        source:
                          pointer: /recurring_transfer/beneficiary_id
                invalid or missing vop proof token:
                  value:
                    errors:
                      - code: invalid_vop_proof_token
                        detail: vop_proof_token is required and must be valid
                        source:
                          pointer: /vop_proof_token
        '401':
          description: Unauthorized
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          description: Forbidden
          $ref: '#/components/responses/403-Forbidden'
  /v2/bank_accounts:
    get:
      tags:
        - Business Accounts
      summary: List business accounts
      description: |-
        OAuth scope: `organization.read`

        Retrieves a list of all business accounts.

        You can use this endpoint when you need to display account details of all business accounts.

        ### Restricted Fields

        Full details of a business account are restricted to users with specific permissions ([more on permissions](https://support-fr.qonto.com/hc/en-us/articles/23947722927249-What-are-the-different-roles-available)). **Owners and admins can access all fields.** Other users, such as managers, will only see a limited set of fields unless granted the appropriate permissions.

        **Fields Available to All Users**:
        - `id`
        - `name`
        - `status`
        - `main`
        - `organization_id`

        **Fields Available to Users with Balance Authorization Read**:
        - `currency`
        - `balance`
        - `balance_cents`
        - `authorized_balance`
        - `authorized_balance_cents`

        Depending on the user's permissions, the corresponding fields will be included in the response.
      operationId: listBusinessAccounts
      security:
        - OAuth:
            - organization.read
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: page
          in: query
          required: false
          description: Page number for pagination. Must be greater than 0.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Number of business accounts per page. Must be between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: List of business accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bank_accounts
                properties:
                  bank_accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankAccount'
        '403':
          $ref: '#/components/responses/403-Forbidden'
    post:
      tags:
        - Business Accounts
      summary: Create a business account
      description: |-
        OAuth scope: `bank_account.write`

        Creates a new business account.

        A business account allows you to receive funds, make payments, and manage your finances. Each business account has its own IBAN and balance, and can be used for a variety of banking operations.

        You can create multiple business accounts and name them based on your business needs (e.g., Primary Account, Project ABC, Tax Pots). This flexibility helps you organize your finances and allocate funds for specific purposes.
      operationId: createBusinessAccount
      security:
        - OAuth:
            - bank_account.write
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank_account
              properties:
                bank_account:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      example: Secondary business account
                      description: Name of the business account
      responses:
        '200':
          description: Business account created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bank_account
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                blank_name:
                  value:
                    errors:
                      - code: blank_name
                        detail: Name can't be blank
                too_long_name:
                  value:
                    errors:
                      - code: too_long_name
                        detail: Name is too long (maximum is 300 characters)
                current_bank_accounts_limit:
                  value:
                    errors:
                      - code: current_bank_accounts_limit
                        detail: Number of bank accounts exceeds the maximum limit
                bank_accounts_limit:
                  value:
                    errors:
                      - code: bank_accounts_limit
                        detail: You have reached the maximum number of bank accounts allowed for your plan
                idempotency_header_missing:
                  value:
                    errors:
                      - code: idempotency_header_missing
                        detail: Idempotency header is required
                        source:
                          header: X-Qonto-Idempotency-Key
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401-Unauthorized'
              examples:
                authorization_header_missing:
                  value:
                    errors:
                      - code: authorization_header_missing
                        detail: authorization header missing
                authorization_token_invalid:
                  value:
                    errors:
                      - code: authorization_token_invalid
                        detail: authorization token invalid
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403-Forbidden'
              examples:
                forbidden:
                  value:
                    errors:
                      - code: forbidden
                        detail: User does not have sufficient permissions for this action.
  /v2/bank_accounts/{id}:
    get:
      tags:
        - Business Accounts
      summary: Get a business account
      description: |-
        OAuth scope: `organization.read`

        Retrieves detailed information about a specific business account identified by its ID.

        It is useful for retrieving up-to-date information, including the current balance and authorized balance of the account.

        You can use this endpoint when you need to display account details or verify available funds before initiating a transfer.


        ### Restricted Fields

        Full details of a business account are restricted to users with specific permissions ([more on permissions](https://support-fr.qonto.com/hc/en-us/articles/23947722927249-What-are-the-different-roles-available)). **Owners and admins can access all fields.** Other users, such as managers, will only see a limited set of fields unless granted the appropriate permissions.

        **Fields Available to All Users**:
        - `id`
        - `name`
        - `status`
        - `main`
        - `organization_id`

        **Fields Available to Users with Balance Authorization Read**:
        - `currency`
        - `balance`
        - `balance_cents`
        - `authorized_balance`
        - `authorized_balance_cents`

        Depending on the user's permissions, the corresponding fields will be included in the response.
      operationId: getBusinessAccount
      security:
        - OAuth:
            - organization.read
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the business account to retrieve
      responses:
        '200':
          description: Business account retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bank_account
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          description: Business account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              example:
                errors:
                  - code: not_found
                    detail: BankAccount not found
                    source:
                      parameter: id
    patch:
      tags:
        - Business Accounts
      summary: Update a business account
      description: |-
        OAuth scope: `bank_account.write`

        Updates the details of a specific business account identified by its ID. Currently, it supports only updating the account name.

        Business accounts can be named based on your needs (e.g., Primary Account, Project ABC, Tax Pots). This flexibility helps you organize your finances and allocate funds for specific purposes.
      operationId: updateBusinessAccount
      security:
        - OAuth:
            - bank_account.write
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the business account to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank_account
              properties:
                bank_account:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      example: Michael Scott
                      description: New name for the business account
      responses:
        '200':
          description: Business account updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bank_account
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                not_a_string:
                  value:
                    errors:
                      - code: not_a_string
                        detail: name must be a string
                        source:
                          pointer: /name
                invalid_name:
                  value:
                    errors:
                      - code: invalid_name
                        detail: Name must present and up to 300 characters
                        source:
                          pointer: /name
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
  /v2/bank_accounts/{id}/close:
    post:
      tags:
        - Business Accounts
      summary: Close a business account
      description: |-
        OAuth scope: `bank_account.write`

        Accessible only using [Strong Customer Authentication](/api-reference/business-api/authentication/sca/sca-flows).

        <Info>
          Example of SCA usage: [**Postman visual flow**](https://www.postman.com/qontoteam/workspace/qonto-public-api/flow/6670429eb7bd63003156bd57)
        </Info>

        Closes a specific business account identified by its ID.

        Once closed, the account can no longer be used for transactions. Before closing an account,
        ensure it has a zero balance and no pending transactions. The main account cannot be closed.

        **Restrictions:**
        - You cannot close your main account.
        - You cannot close an businesss account with a non-zero balance.
        - External businesss accounts cannot be closed through this API.
      operationId: closeBusinessAccount
      security:
        - OAuth:
            - bank_account.write
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the business account to close
        - name: X-Qonto-Sca-Session-Token
          in: header
          required: false
          schema:
            type: string
          description: SCA session token for strong customer authentication
        - name: X-Qonto-MFA
          in: header
          required: false
          schema:
            type: string
          description: MFA token for strong customer authentication
        - name: X-Qonto-2fa-Preference
          in: header
          required: false
          schema:
            type: string
          description: 2FA preference for the request
      responses:
        '200':
          description: Business account closed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - bank_account
                properties:
                  bank_account:
                    $ref: '#/components/schemas/BankAccount'
        '400':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                main_account:
                  value:
                    errors:
                      - code: main_account
                        detail: Cannot close main account
                balance_not_zero:
                  value:
                    errors:
                      - code: balance_not_zero
                        detail: Cannot close an account with money on it
                external_bank_account:
                  value:
                    errors:
                      - code: external_bank_account
                        detail: External bank accounts cannot be closed
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
  /v2/bank_accounts/{id}/iban_certificate:
    get:
      tags:
        - Business Accounts
      summary: Download the IBAN certificate
      description: |-
        OAuth scope: `organization.read`

        Downloads the IBAN certificate for a specific business account identified by its ID.

        **Restrictions:**
        - The organization must complete all compliance checks.
        - The business account must be active.
        - Qonto cannot generate an IBAN certificate for an external businesss accounts.
      operationId: downloadBusinessAccountIbanCertificate
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the business account to close
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum:
              - en
              - fr
              - it
              - de
              - es
              - pt
              - nl
            example: en
          description: The locale used for the IBAN certificate. If not specified, it defaults to the organization's country of registration.
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400-Bad-request'
              examples:
                unsupported_locale:
                  value:
                    errors:
                      - code: not_included
                        detail: 'locale must be one of: en, fr, it, de, es, pt, nl'
                        source:
                          pointer: /locale
                pending_iban:
                  value:
                    errors:
                      - code: iban_generation_failed
                        detail: IBAN is not created
                kyb_not_accepted:
                  value:
                    errors:
                      - code: iban_generation_failed
                        detail: Organization is not KYB accepted
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
  /v2/external_transfers:
    get:
      tags:
        - External Transfers (deprecated)
      deprecated: true
      summary: List external transfers
      description: |
        OAuth scope: `organization.read`.

        <Warning>
          This endpoint will be sunsetted on March 31, 2026.
          For SEPA transfers, please use the [List a SEPA Transfer](/api-reference/business-api/payments-transfers/sepa-transfers/sepa-transfers) endpoint instead.
        </Warning>

        Retrieves the list of external transfers for the authenticated organization.
      operationId: list_external_transfers
      responses:
        '200':
          description: Returns the list of external transfers for the authenticated organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalTransfer'
                required:
                  - external_transfers
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
      security:
        - OAuth:
            - organization.read
        - SecretKey: []
    post:
      tags:
        - External Transfers (deprecated)
      deprecated: true
      summary: Create an external transfer for a trusted beneficiary
      description: |-
        OAuth scope: `payment.write`

        <Warning>
          This endpoint will be sunsetted on March 31, 2026.
          For SEPA transfers, please use the [Create a SEPA Transfer](/api-reference/business-api/payments-transfers/sepa-transfers/sepa-transfers/create) endpoint instead.
          The new endpoint works for both trusted and untrusted beneficiaries.
        </Warning>

        Creates a single external transfer for a given **trusted** beneficiary, without any user interaction required.

        The beneficiary must be trusted for the transfer to be created. The beneficiary can **only** be trusted through the Qonto app (for more details, please refer to [this article](https://support-fr.qonto.com/hc/en-us/articles/23947644174993-How-can-I-mark-a-payee-as-trustworthy#h_925061f25d)).

        By default, the transfer will be processed as **instant**. If instant processing isn't possible, it will automatically fall back to standard processing.
        It will be the case if the amount of the transfer is above the following thresholds:
          - The transfer is above 10,000 EUR;
          - More than 50,000 EUR have been sent to this beneficairy within 24 hours.

        To learn more about instant transfers, please read [this article](https://support-fr.qonto.com/hc/en-us/articles/23947629441681-How-to-make-an-instant-transfer-in-euros-SEPA).
      operationId: create_external_transfer
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Idempotency-Key'
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vop_proof_token:
                  type: string
                  description: Proof token from a payee verification attempt or skip verification request. Use the token from [verify payee](/api-reference/business-api/payments-transfers/sepa-transfers/verify-payee#tag/Verify-SEPA-Payee/operation/verifyPayee).
                  example: proof_1234567890abcdef
                external_transfer:
                  type: object
                  properties:
                    beneficiary_id:
                      type: string
                      description: '`id` of the trusted beneficiary.'
                      format: uuid
                    debit_iban:
                      type: string
                      description: IBAN of account to debit.
                    reference:
                      type: string
                      description: Can be used to enter transfer details to further describe the transfer. Maximum `reference` length is `99` characters.
                    note:
                      type: string
                    currency:
                      type: string
                      description: Allowed values is only `EUR` at the moment.
                    scheduled_date:
                      type: string
                      example: '2021-07-12'
                      description: The transfer will be executed on the `scheduled_date` (YYYY-MM-DD) at midnight (GMT).
                      default: Current date or next banking day
                    amount:
                      type: string
                      description: Corresponds to the amount of the transaction in the `currency` of the bank account. Amounts must be https://www.w3.org/TR/payment-request/#dfn-valid-decimal-monetary-value.
                    attachment_ids:
                      type: array
