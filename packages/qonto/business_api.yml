      summary: Mark a client invoice as paid
      description: |-
        OAuth scope: `client_invoice.write`

        Marks a client invoice as paid by updating its status from `unpaid` to `paid`.

        **Requirements:**
        - The invoice must exist and be accessible to the authenticated organization
        - The invoice status should be `unpaid` for this operation to be meaningful
        - The `paid_at` date cannot be in the future. If not filled, by default the current date is used.

        <Info>
          If the invoice is already paid, you can still use this endpoint to update the `paid_at` date.
        </Info>
      operationId: mark_client_invoice_as_paid
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: id
          in: path
          description: UUID of the client invoice to mark as paid.
          required: true
          schema:
            type: string
            format: uuid
            example: e3d68a1a-b23f-496a-a9a2-815089337720
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at:
                  type: string
                  format: date
                  description: The date when the invoice was paid. Must be in YYYY-MM-DD format and cannot be in the future. If not filled, by default the current date is used.
                  example: '2024-12-15'
      responses:
        '200':
          description: Invoice successfully marked as paid. Returns the updated invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_invoice:
                    $ref: '#/components/schemas/ClientInvoice'
                required:
                  - client_invoice
        '400':
          $ref: '#/components/responses/400-Bad-request'
