    CardDataV1:
      type: object
      properties:
        event:
          type: string
          enum:
            - created
            - activated
            - unlocked
            - locked
            - nickname_updated
            - options_updated
            - limits_updated
            - restrictions_updated
            - discarded
            - expired
          description: |
            Event triggering the webhook

            `created`: the card has been created.
            `activated`: the card has been activated and can be used.
            `unlocked`: the card has been unlocked and can be used.
            `locked`: the card has been locked and cannot be used.
            `nickname_updated`: the card nickname has been updated.
            `options_updated`: the card options have been updated.
            `limits_updated`: the card limits have been updated.
            `restrictions_updated`: the card restrictions have been updated.
            `discarded`: the card has been discarded and cannot be used.
            `expired`: the card has expired and cannot be used.
          example: created
        id:
          type: string
          description: Unique card identifier
          format: uuid
        nickname:
          type: string
          description: Display name for the card.
          minLength: 1
          maxLength: 40
          example: 💳 for 🍗
        status:
          type: string
          enum:
            - pending
            - live
            - paused
            - stolen
            - lost
            - pin_blocked
            - discarded
            - expired
            - shipped_lost
            - onhold
            - order_canceled
            - pre_expired
            - abusive
          description: |-
            Status of the card.
            Pending: the card is awaiting PIN to be set or issuing to complete.
            Live: the card is active and can be used.
            Paused: the card is paused and cannot be used until un-paused.
            Stolen: the card has been reported as stolen and cannot be used.
            Lost: the card has been reported as lost and cannot be used.
            Pin_blocked: the card has been blocked due to too many wrong PIN attempts. It can still be used for card-not-present transactions.
            Discarded: the card has been discarded and cannot be used.
            Expired: the card has expired and cannot be used.
            Shipped_lost: the card has been lost during shipping and cannot be used.
            Onhold: the card issuing is on hold due to missing KYC/KYB validation and cannot be used.
            Order_canceled: the card order has been canceled.
            Pre_expired: the flash card has reached the end of its validity and cannot be used.
            Abusive: the card has been reported as abusive and cannot be used.
          example: pending
        masked_pan:
          type: string
          description: String representing the masked PAN of card.
          example: 511768******7662
        exp_month:
          type: string
          description: The expiration month. [1-12]
          format: number
          example: '3'
        exp_year:
          type: string
          description: The expiration year.
          format: number
          example: '2024'
        atm_option:
          type: boolean
          description: Flag indicating whether the card could withdraw money on an ATM.
          example: true
        nfc_option:
          type: boolean
          description: Flag indicating whether the card could make a payment with NFC mode (contactless).
          example: true
        online_option:
          type: boolean
          description: Flag indicating whether the card could make an online payment.
          example: true
        foreign_option:
          type: boolean
          description: Flag indicating whether the card could make a payment outside of France.
          example: true
        atm_daily_limit:
          type: string
          description: 'Total of withdrawal limit per day. (unit: euro)'
          example: '1000.00'
        atm_daily_limit_option:
          type: boolean
          description: Flag indicating whether the total amount per day limit should be applied to atm withdrawals
          example: true
        atm_monthly_limit:
          type: string
          description: 'Total of ATM limit per month (unit: euro).'
          example: '1000.00'
        payment_monthly_limit:
          type: string
          description: 'Total of payment spend on the current month (unit: euro).'
          example: '1000.00'
        payment_daily_limit:
          type: string
          description: Total of payment limit per day.
          example: '1000.00'
        payment_daily_limit_option:
          type: boolean
          description: Flag indicating whether the total amount per day limit should be applied to payments
          example: true
        payment_transaction_limit:
          type: string
          description: Total of payment limit per transaction.
          example: '1000.00'
        payment_transaction_limit_option:
          type: boolean
          description: Flag indicating whether the total amount per transaction limit should be applied to payments
          example: true
        payment_lifespan_limit:
          type: string
          description: 'Total amount spent on the card since its creation (unit: euro).'
          example: '42.00'
        active_days:
          $ref: '#/components/schemas/card_active_days'
        holder_id:
          type: string
          description: The membership identifier of the card holder.
          format: uuid
        bank_account_id:
          type: string
          description: The id of the bank account to which the card is attached
          format: uuid
        updated_at:
          type: string
          description: Datetime at which the object was last updated.
          format: date-time
        created_at:
          type: string
          description: Datetime at which the object was created.
          format: date-time
        card_type:
          type: string
          enum:
            - debit
            - prepaid
          description: Type of the card
          example: debit
        card_level:
          type: string
          description: Level of the card. A level defines a set of card capabilities and pricing.
          example: standard
        category_tags:
          $ref: '#/components/schemas/card_categories'
        renewal:
          type: boolean
          description: Flag indicating whether the card is a renewal card
          example: false
        upsell:
          type: boolean
          description: Flag indicating whether the card is an upsell child card
          example: false
        discarded_at:
          type: string
          description: Datetime at which the card will be discarded after being upsold. (upsold_at  + 30 days)
          format: ^[0-9]{4,}-[0-9]{2}-[0-9]{2}$
          example: '2022-11-31'
      required:
        - event
        - id
        - status
        - atm_option
        - nfc_option
        - online_option
        - foreign_option
        - atm_daily_limit_option
        - payment_daily_limit_option
        - payment_transaction_limit_option
        - active_days
        - holder_id
        - bank_account_id
        - updated_at
        - created_at
        - card_type
        - card_level
        - category_tags
        - renewal
        - upsell
    WebhookPayloadCardsV1:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CardDataV1'
    PaymentLinkDataV1:
      type: object
      properties:
        event:
          type: string
          enum:
            - created
            - updated
          description: |
            Event triggering the webhook

            `created`: the payment link has been created.
            `updated`: the payment link has been updated.
          example: created
        payment_link_id:
          type: string
          format: uuid
          description: Unique identifier for the payment link
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          enum:
            - open
            - processing
            - paid
            - canceled
            - expired
          description: |-
            Status of the payment link.
            Open: the payment link has been created and is open and can be used.
            Processing: the payment link is being processed.
            Paid: the payment link has been paid.
            Canceled: the payment link has been canceled.
            Expired: the payment link has expired.
          example: open
        amount:
          type: object
          required:
            - value
            - currency
          properties:
            value:
              type: string
              description: Payment amount as string, with a period as decimal separator
              example: '50.00'
            currency:
              type: string
              description: Payment currency (ISO 4217)
              example: EUR
        resource_id:
          type: string
          description: Identifier of the associated resource
          example: 46e9e0d2-f1af-4d2e-a6be-a536a604b89e
        resource_type:
          type: string
          enum:
            - Invoice
            - Basket
          description: Type of the associated resource
          example: Basket
        resource_metadata:
          type: object
          description: Additional metadata about the resource
          example:
            invoice_number: INV-123
        potential_payment_methods:
          type: array
          items:
            type: string
          description: List of payment methods that can be used with this payment link
          example:
            - credit_card
            - sepa_credit_transfer
        latest_payment_method_used:
          type: string
          description: The most recent payment method used for this payment link
          example: credit_card
        expired_at:
          type: string
          format: date-time
          description: When the payment link expires/expired
          example: '2025-01-24T10:54:00Z'
        created_at:
          type: string
          format: date-time
          description: When the payment link was created
          example: '2025-01-24T10:54:00Z'
        updated_at:
          type: string
          format: date-time
          description: When the payment link was last updated
          example: '2025-01-24T10:55:00Z'
    WebhookPayloadPaymentLinksV1:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaymentLinkDataV1'
    PaymentLinkConnectionDataV1:
      type: object
      properties:
        event:
          type: string
          enum:
            - connection_enabled
            - connection_revoked
          description: |
            Event triggering the webhook

            `connection_enabled`: the payment links connection has been enabled.
            `connection_revoked`: the payment links connection has been revoked.
          example: connection_enabled
    WebhookPayloadPaymentLinksConnectionsV1:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaymentLinkConnectionDataV1'
