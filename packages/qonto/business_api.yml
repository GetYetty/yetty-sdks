      summary: Create an internal transfer
      description: |-
        OAuth scope: `internal_transfer.write`

        Creates a single instant transfer between 2 bank accounts of the authenticated organization.

        You can obtain the bank accounts' IBAN through the [GET /v2/organization](/api-reference/business-api/accounts-organizations/organizations/retrieve-the-authenticated-organization-and-list-bank-accounts) endpoint.
      parameters:
