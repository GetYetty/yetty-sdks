    patch:
      tags:
        - Payment Links
      summary: Deactivate a payment link
      description: |
        OAuth scope: `payment_link.write`

        Allows you to deactivate a payment link.
      operationId: deactivatePaymentLink
      security:
        - OAuth:
            - payment_link.write
      responses:
        '200':
          description: The payment link has been deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivatePaymentLinkResponse'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-Not-Found'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v2/payment_links/{id}/payments:
    get:
      tags:
        - Payment Links
      summary: List payments for a payment link
      description: |
        OAuth scope: `payment_link.read`

        Allows you to get the payments for a payment link.
      operationId: getPaymentLinkPayments
      security:
        - OAuth:
            - payment_link.read
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - $ref: '#/components/parameters/PaymentLinkIdPathParam'
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationPerPage'
        - name: status
          in: query
          description: Filter payments by status.
          schema:
            type: array
            enum:
              - open
              - pending
              - authorized
              - paid
              - canceled
              - expired
              - failed
            items:
              type: string
              enum:
                - open
                - pending
                - authorized
                - paid
                - canceled
                - expired
                - failed
            example: '?status[]=open&status[]=pending'
        - name: sort_by
          in: query
          description: Sort payments by a field.
          schema:
            type: string
            enum:
              - creation_date:asc
              - creation_date:desc
            example: '?sort_by=creation_date:asc'
      responses:
        '200':
          description: The payments have been retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinkPaymentsResponse'
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v2/payment_links/payment_methods:
    get:
      tags:
        - Payment Links
      summary: List available payment methods
      description: |
        OAuth scope: `payment_link.read`

        Allows you to get the available payment methods.
      operationId: getPaymentLinkPaymentMethods
      security:
        - OAuth:
            - payment_link.read
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: amount
          in: query
          description: The amount of the payment link. Must be provided along with the currency.
          schema:
            type: string
            example: '?amount=10.00'
        - name: currency
          in: query
          description: The currency of the payment link. Must be provided along with the amount.
          schema:
            type: string
            example: '?currency=EUR'
        - name: locale
          in: query
          description: The locale of the payment link. Can be provided instead of the amount and currency.
          schema:
            type: string
            example: '?locale=fr'
      responses:
        '200':
          description: The payment methods have been retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinkPaymentMethodsResponse'
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v1/encoded_requests/dispatch:
    post:
      tags:
        - Encoded Requests
      summary: Dispatch an encoded request
      description: |
        Allows you to dispatch an encoded request.

        This endpoint is meant to be called by your backend, to proxy requests built for you by our client SDK.

        Depending on the underlying proxied endpoint, you may need to include specific headers, such as an `Authorization` header or other custom headers required by the proxied service.
        Please refer to the [API documentation](https://docs.qonto.com/api-reference/introduction) for detailed information on the required headers for each endpoint.
      operationId: dispatchEncodedRequest
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchEncodedRequestRequest'
      responses:
        '200':
          description: The encoded request has been dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchEncodedRequestResponse'
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
  /v1/embed_auth_links:
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    post:
      tags:
        - Embed Auth Links
      summary: Create an Embed Auth Link
      description: |
        OAuth scope: `embed_auth_link.write`

        Allows you to create an Embed Auth Link.

        Embed Auth Links allows your customers to seamlessly authenticate to Qonto Embed's Hosted Pages. Authentication works both for Hosted Pages served via redirect and iframe.
      operationId: createEmbedAuthLink
      security:
        - OAuth:
            - embed_auth_link.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbedAuthLinkRequest'
      responses:
        '200':
          description: The embed auth link has been created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEmbedAuthLinkResponse'
        '400':
          $ref: '#/components/responses/400-Bad-request'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '500':
          $ref: '#/components/responses/500-Internal-Server-Error'
