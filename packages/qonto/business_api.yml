                        status: completed
                        note: Rhea Ernser
                        reference: null
                        vat_amount: null
                        vat_amount_cents: null
                        vat_rate: null
                        initiator_id: ccdcef78-1aa1-4d44-b991-b10005a4ad1a
                        label_ids:
