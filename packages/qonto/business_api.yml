      type: object
      required:
        - partner_callback_url
        - user_bank_account_id
        - user_phone_number
        - business_description
      properties:
        partner_callback_url:
          type: string
          description: URL to redirect the user to after the connection is completed.
          example: https://partner.com/payment-links/onboarding-callback
        user_bank_account_id:
          type: string
          description: The bank account ID to link to the payment links provider profile.
          example: 46e9e0d2-f1af-4d2e-a6be-a536a604b89e
        user_phone_number:
          type: string
          format: e164
          description: The phone number to associate with the payment links provider account.
          example: '+33612345678'
        user_website_url:
          type:
            - 'null'
            - string
          format: http
          pattern: ^https?[^@]*$
          description: The user's website URL. The url is valid if it starts with http or https and does not contain any @
          example: https://the-user-website.com
        business_description:
          type:
            - 'null'
            - string
          minLength: 80
          description: The business description to associate with the payment links provider account.
          example: An 80-chars long string describing the business. An 80-chars long string describing the business.
