          type: array
          items:
            $ref: '#/components/schemas/EInvoicingLifecycleEvent'
        meta:
          type: object
          properties:
            integration_type:
              type: string
              example: amazon
            connector:
              type: string
              example: grover
            accounting_recorded_at:
              type: string
              format: date-time
            accounting_recorded_source:
              type: string
              example: regate
        available_actions:
          type: object
          properties:
            delete:
              type: boolean
              description: Indicates if the invoice can be deleted
            archive:
              type: boolean
              description: Indicates if the invoice can be archived
            unarchive:
              type: boolean
              description: Indicates if the invoice can be unarchived
            pay:
              type: boolean
              description: Indicates if the invoice can be paid
            reasons:
              type: object
              nullable: true
              properties:
                pay:
                  type: array
                  items:
                    type: string
                    enum:
                      - is_credit_note
                      - missing_iban
                      - missing_data
                      - invalid_status
                      - incorrect_approval_workflow
                  description: List of reasons why the invoice cannot be paid
                delete:
                  type: array
                  items:
                    type: string
                    enum:
                      - invalid_status
                      - linked_self_invoice
                      - is_recorded
                  description: List of reasons why the invoice cannot be deleted
                archive:
                  type: array
                  items:
                    type: string
                    enum:
                      - invalid_status
                  description: List of reasons why the invoice cannot be archived
                unarchive:
                  type: array
                  items:
                    type: string
                    enum:
                      - invalid_status
                  description: List of reasons why the invoice cannot be unarchived
              description: Detailed reasons for why certain actions are not available
          description: Available actions for the invoice
        declined_note:
          type: string
          description: Note specified when invoice was archived
          default: ''
        approval_workflow:
          type: object
          nullable: true
          properties:
            approver_ids:
              description: Membership IDs of the users who are next in line to approve the invoice
              type: array
              minItems: 0
              items:
                type: string
                format: uuid
            supplier_invoice_request_id:
              type: string
              nullable: true
              format: uuid
            verified_by:
              description: ID of the membership that verified the supplier invoice and send it to approval workflow
              type: string
              format: uuid
              nullable: true
            last_approved_by:
              description: ID of the last membership that approved the supplier invoice request
              type: string
              format: uuid
              nullable: true
          required:
            - approver_ids
            - supplier_invoice_request_id
            - verified_by
            - last_approved_by
        payable_amount:
          type: object
          nullable: true
          properties:
            value:
              type: string
              example: '22.10'
            currency:
              type: string
              example: EUR
        total_amount_credit_notes:
          type: object
          nullable: true
          properties:
            value:
              type: string
              example: '22.10'
            currency:
              type: string
              example: EUR
        is_credit_note:
          type: boolean
          example: false
        has_suggested_credit_notes:
          type: boolean
          example: false
        related_invoices:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SupplierInvoiceRelatedInvoice'
        suggested_transactions:
          type: array
          nullable: true
          description: suggested transactions for the invoice
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
                description: id of the suggested transaction
              score:
                type: string
                example: '0.8'
                description: match confidence score
    SupplierInvoiceListResponse:
      allOf:
        - $ref: '#/components/schemas/SupplierInvoice'
    DocumentItem:
