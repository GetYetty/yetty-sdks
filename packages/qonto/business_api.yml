          description: The category of the attachment
          example: INVOICE
          enum:
            - INVOICE
            - EXPENSE_RECEIPT
            - CARD_RECEIPT
            - CREDIT_CARD_RECEIPT
            - CREDIT_NOTE
            - OTHER_FINANCIAL_DOCUMENT
            - OTHER_NON_FINANCIAL_DOCUMENT
            - UNKNOWN
        is_attachment_non_financial:
          type: boolean
