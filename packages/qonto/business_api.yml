          type: string
          example: '2022-03-04T17:58:30+02:00'
        matched_transactions:
          type: array
          items:
            type: string
            format: uuid
            example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
        transfer_ids:
          type: array
          items:
            type: string
            format: uuid
            example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
