  /oauth2/auth:
    servers:
      - url: https://oauth.qonto.com
        description: Production URL
      - url: https://oauth-sandbox.staging.qonto.co
        description: Sandbox URL
    get:
      tags:
        - OAuth 2.0
      summary: Retrieve an authorization code
      security:
        - {}
      description: |-
        Retrieves the authorization of the Qonto user i.e. an authorization code that you will be able to exchange for a [set of tokens](/api-reference/business-api/authentication/oauth2/create_tokens).

        1. Your app should include a "Connect with Qonto" button which should trigger this endpoint;
          <Warning>
            If you are triggering this endpoint on the Sandbox environment (https://oauth-sandbox.staging.qonto.co), please make sure to be logged in on the [Sandbox web-app](https://sandbox.staging.qonto.co/devportal) first through your [Developer Portal](https://developers.qonto.com/) account.
          </Warning>
          <Info>
            If you just want to connect your app to one single organization, you can just send the endpoint URL to the Qonto user from whom you need to get the consent.
          </Info>
        2. After clicking on your button, the Qonto user will be redirected to Qonto and will have to authenticate;
        3. (optional) The Qonto will have to select an organization;
        3. The Qonto user will have to give their consent to your app for the organization they have just selected (or for the organization identified by the `organization_id` or the `registration_id` query parameter);
        4. The Qonto user will be automatically redirected back to your `redirect_uri`.
      parameters:
        - name: client_id
          in: query
          required: true
          example: 475670cc-e41a-4baa-8eb6-4329af7d1450
          schema:
            type: string
          description: |-
            Unique identifier of your application. Please sign up to the [Developer Portal](https://developers.qonto.com/sign-up/) to get one.

            Example: "475670cc-e41a-4baa-8eb6-4329af7d1450"
        - name: redirect_uri
          in: query
          required: true
          example: https%3A%2F%2Fmy-company-server.com%2F
          schema:
            type: string
          description: |-
            URI to which the Qonto user will be redirected back after they have accepted the connection of your application with their account.
            **☝️ `redirect_uri` needs to be encoded through [this tool](https://www.urlencoder.org/).**

            Example: "https%3A%2F%2Fmy-company-server.com%2F"
        - name: scope
          in: query
          required: true
          example: offline_access organization.read
          schema:
            type: string
          description: |-
            It represents the list of permission that your application is requesting on the user account. It can be a single scope or a list of scopes together. In the latter case, the scopes must be written as a space separated list of values.

            Examples:
            - Single scope : "offline_access"
            - Multiple scopes: "offline_access organization.read payment.write"

            Use the `offline_access` scope if you require a refresh token.

            Please refer to the API Reference section of this documentation to find which specific scopes are required for the actions you would like to perform. You will find the list of the available scopes [here](/get-started/business-api/authentication/oauth/available-scopes).
        - name: response_type
          in: query
          required: true
          example: code
          schema:
            type: string
          description: Type of authentication flow. Only `code` is supported.
        - name: state
          in: query
          required: true
          example: this-is-my-unique-value
          schema:
            type: string
          description: |-
            It is a security parameter to protect against forgery attacks.

            You need to pass a value that is unique to the user authenticating.
            At the end of the authentication process, you should compare the received state with the one you provided to make sure they are equal.

            Example: "this-is-my-unique-value"
        - name: organization_id
          in: query
          required: false
          example: 1acf250c-a068-47fa-ae9d-032b85c148dc
          schema:
            type: string
          description: |-
            If you want to restrict the user to connect to a specific organization, you can pass the `organization_id` here. If this parameter is present, then the user won't be asked to select an organization during the OAuth flow.

            Example: "1acf250c-a068-47fa-ae9d-032b85c148dc"
        - name: registration_id
          in: query
          required: false
          example: a584b060-8c96-488d-8bbb-74f0d3d2803c
          schema:
            type: string
          description: |-
            Starts the OAuth flow with a pre-selected organization, linked to the `registration_id` obtained during the onboarding flow. If this parameter is provided, then the user won't be asked to select an organization during the OAuth flow.

            Example: "a584b060-8c96-488d-8bbb-74f0d3d2803c"
      responses:
        '302':
          description: |-
            Redirects the user to Qonto in order to get their authorization.
            ⚠️ Once the user is redirected to your redirect URI, you need to check the received `state` parameter against the one you provided on the request. If they do not match, you should stop the process as the request might have been forged by a malicious third party.
          headers:
            Location:
              description: Redirect URI with authorization code
              schema:
                type: string
                example: https://my-company-server.com?code=ory_ac_lY8t9YfHv3N2tLEKFfgL5_XADs2sbcxVGcYPbneMAAo.w-9CyjAz0DB-_3q2s5ZpYk-oFEUCBcMTU_s5iy07CA0&scope=offline_access+organization.read&state=this-is-my-unique-value
        '400':
          description: Returns a bad request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: OAuth2 error code
                    example: invalid_grant
                  error_verbose:
                    type: string
                    description: Detailed error description
                    example: The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client
                  error_description:
                    type: string
                    description: Human-readable error description
                    example: The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client
                  status_code:
                    type: integer
                    description: HTTP status code
                    example: 400
                required:
                  - error
                  - error_verbose
                  - error_description
                  - status_code
              examples:
                invalid_grant:
                  summary: Invalid Grant Error
                  value:
                    error: invalid_grant
                    error_verbose: The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client
                    error_description: The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client
                    status_code: 400
        '404':
          description: Returns a not found error. This is generally due to a wrong `client_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: not_found
                  error_description:
                    type: string
                    example: Client not found
        '500':
          description: Returns an internal server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal_server_error
                  error_description:
                    type: string
                    example: Internal Server Error
                required:
                  - error
                  - error_description
  /oauth2/token:
    servers:
      - url: https://oauth.qonto.com
        description: Production URL
      - url: https://oauth-sandbox.staging.qonto.co
        description: Sandbox URL
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    post:
      tags:
        - OAuth 2.0
      summary: Create or refresh tokens
      security:
        - {}
      description: |-
        <Warning>This call must be performed on your backend as you should never expose your client secret.</Warning>

        Creates or refreshes a set of tokens for the authenticated membership.

        This set of tokens contains:
          - always: an access token (you will need this token to authenticate yourself to any other endpoint);
          - if you used the `offline_access` scope when [retrieving an authorization code](/api-reference/business-api/authentication/oauth2/retrieve_authorization): a refresh token; 
          - if you used the `openid` scope when [retrieving an authorization code](/api-reference/business-api/authentication/oauth2/retrieve_authorization): an ID token.

        The access token and the ID token are valid for **1 hour**,  the refresh token for **90 days**.  Once the access token has reached its expiration date, you won’t be able to access the Business API with it anymore.

        <AccordionGroup>

          <Accordion title="If you create a set of tokens for the first time">
            Use the authorization `code` you've received at [the previous step](/api-reference/business-api/authentication/oauth2/retrieve_authorization).
          </Accordion>

          <Accordion title="If you want to refresh an existing access token">
            Use the last refresh token you've received.
            <Warning>Don’t forget to store your new refresh token as the previous one will be invalidated 👉 you will need it for the next refresh.</Warning>
            Always opt for a **proactive** refresh vs a reactive refresh to avoid reaching the [rate limitations](/get-started/general/rate-limitations), i.e. check if your access token is expired and refresh it if needed before making any API call instead of refreshing it after getting a `401` error.
          </Accordion>

        </AccordionGroup>
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Unique identifier of your application. Please sign up to the [Developer Portal](https://developers.qonto.com/sign-up/) to get one.
                  example: 475670cc-e41a-4baa-8eb6-4329af7d1450
                client_secret:
                  type: string
                  example: this-is-my-amazing-secret
                  description: Secret of your application. Please sign up to the [Developer Portal](https://developers.qonto.com/sign-up/) to get one.
                grant_type:
                  type: string
                  description: |-
                    Type of token you are providing to generate your access token.
                    - If you are creating your first set of tokens: `authorization_code`
                    - If you are refreshing an existing access token: `refresh_token`
                  example: authorization_code
                redirect_uri:
                  type: string
                  description: |-
                    URI to which the Qonto user will be redirected back after they have accepted the connection of your application with their account.
                    This value is used here for verification purpose in case you provided multiple `redirect_uri`.
                    Use this parameter when creating your first set of tokens.
                  example: https://my-company-server.com
                code:
                  type: string
                  description: |-
                    Temporary authorization code received on the `redirect_uri`.
                    Keep in mind that this code is only valid for **10 minutes**.
                    Use this parameter to create your first set of tokens.
                  example: ory_ac_lY8t9YfHv3N2tLEKFfgL5_XADs2sbcxVGcYPbneMAAo.w-9CyjAz0DB-_3q2s5ZpYk-oFEUCBcMTU_s5iy07CA0
                refresh_token:
                  type: string
                  description: |-
                    Last refresh token. Use this parameter to refresh an existing access token.

                    Please note that your refresh token remains valid within a grace period of **60 seconds after its first usage**, allowing multiple usages without immediate invalidation. When the grace period ends, the refresh token will be invalidated. This can be beneficial in scenarios where network issues or delayed token exchanges may otherwise disrupt session continuity.
                  example: ory_rt_7kRxfEQzaBuL9RRSusC_vKRUNmtr1jdUC_i2NORdmZU.Ze-WLB5gZa7UIbhHSgv3KCpqvJHMZHUn6hgc1XOGoRU
              required:
                - client_id
                - client_secret
                - grant_type
      responses:
        '200':
          description: Returns the set of tokens created. If you are receiving an HTML response, please make sure you've included the `X-Qonto-Staging-Token` header in your request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: ory_at_2-ocNFHnqdPjEOs9FdHMf6jKO4VNTVvLp3zChWVItoY.CaKVRy-plm-pr2mKk22Nt3ThgVjHmfkrolgTmMapvCI
                    description: |-
                      Bearer token to use in the Authorization header of your API requests.
                      This token is valid for **1 hour**.
                  expires_in:
                    type: integer
                    example: 3600
                    description: Access token lifespan in seconds.
                  refresh_token:
                    type: string
                    example: ory_rt_7kRxfEQzaBuL9RRSusC_vKRUNmtr1jdUC_i2NORdmZU.Ze-WLB5gZa7UIbhHSgv3KCpqvJHMZHUn6hgc1XOGoRU
                    description: |-
                      Token to exchange against a new `access_token` when it reaches its end of life.
                      This token is valid for **90 days**.

                      ☝️ To receive the refresh token, you need to use the `offline_access` scope when [retrieving an authorization code](/api-reference/business-api/authentication/oauth2/retrieve_authorization).
                  id_token:
                    type: string
                    example: eyJhbGciOiJSUzI1NiIsImtpZCI6InByaXZhdGU6NzY4ZTk0OTYtMmJlOS00OTg4LTllNzUtZTU2NTEwODI5YzhjIiwidHlwIjoiSldUIn0..N2M3LiDbNvA115Foed1YVJ8mqr_mq_8-gmAJ6FkhWyx45gpUpeKji4U0lWbh3sYN1cd90aSwhZnrxxTxVsJAo6pvbWkw0ghzMasmltqAbxttPW-GgfieUh1ipbgE7ekmNPT6Op_qAU_E5OhZDKd01HC07on5FdVkdHeZGSN0ahZ4MezlmYA85Ig_qDM-7hW0DQhlATRuYpatl5hIE_7oiGsTrcsUgNYxoIILOCSP_FhHGJRtKah1wVqRhPu5fQG277mOTugI463yMDzAJMRgptEfpA02whnB6tycXKNfRDdFbYS1jxKzwSFTX3QAmhDWWJl4fgyAYe3ur_pD9jqlb9hpZwXFThJzfxyvKkPwiZjaVmWZi1dAhAzE2jZH6ktwimVbDjI3uWiOwz10AsYoTpZXf17jJRrR7bzj_ayYlh1G3JfIEPgiK4QkekWcV9uerWS_9ziyPqVOZw-sBEGZC19JcvMW1pzlK9az9aTKekBmzmCdXw9ankc_-1rfd9rB2oco_-_Vh9hKk5jHExHk0GZ1C48C-UZd7iB0VpQC7R_93gvHk3crIvyPqcZQl7PPBoqYK9thuliLpCkPhJ_nYX-2RDUfeI6wHL26hklCU3t-N-SAecZ34WBkk9S30cvY333HPZi1lNxEptc0obmjCMCYcSg0Sr_Ctk9Z8nXrMEU
                    description: |-
                      JSON Web Token that contains information about the user and the session. It can be digitally verified by your application to create a session.
                      This token is valid for **1 hour**.

                      ☝️ To receive the ID token, you need to use the `openid` scope when [retrieving an authorization code](/api-reference/business-api/authentication/oauth2/retrieve_authorization).
                  scope:
                    type: string
                    example: offline_access organization.read
                    description: List of scopes granted to your application.
                  token_type:
                    type: string
                    example: bearer
                    description: Type of token you have requested. It will always be bearer.
                required:
                  - access_token
                  - expires_in
                  - scope
                  - token_type
        '400':
          description: Returns a bad request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_grant
                  error_description:
                    type: string
                    example: The provided authorization grant (e.g., authorization code, resource owner credentials) or refresh token is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client. The authorization code has already been used.
                required:
                  - error
                  - error_description
        '401':
          description: Returns an unauthorized error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
                  error_description:
                    type: string
                    example: Client authentication failed (e.g., unknown client, no client authentication included, or unsupported authentication method).
                required:
                  - error
                  - error_description
        '500':
          description: Returns an internal server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: internal_server_error
                  error_description:
                    type: string
                    example: Internal Server Error
                required:
                  - error
                  - error_description
  /v2/oauth2/consents:
    parameters:
      - $ref: '#/components/parameters/X-Qonto-Staging-Token'
    delete:
      tags:
        - OAuth 2.0
      security:
        - OAuth:
            - organization.read
      summary: Revoke consents
      description: |-
        OAuth scope: `organization.read`

        Revokes the OAuth 2 consents for the authenticated membership. Use this endpoint to allow your user to disconnect your app from Qonto.
