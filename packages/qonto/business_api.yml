          style: deepObject
          explode: true
          schema:
            type: object
            enum:
              - filter[tax_identification_number]
              - filter[vat_number]
              - filter[email]
              - filter[name]
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            example: 25
        - name: per_page
          in: query
          description: Number of clients per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: integer
            example: 25
        - name: sort_by
          in: query
          description: 'Clients can be sorted by their `created_at` / `name` property in 2 possible orders: `asc` (Ascending) / `desc` (Descending).'
          schema:
            type: string
            enum:
              - created_at:asc
              - created_at:desc
              - name:asc
              - name:desc
            default: name:asc
