    SupplierInvoiceStatus:
      type: string
      example: to_review
      oneOf:
        - const: to_review
          description: Initial status for invoices.
        - const: to_pay
          description: Deprecated status - use to_review instead.
        - const: to_approve
          description: Invoice has been assigned an approval workflow and requires approval before payment.
        - const: awaiting_payment
          description: Invoice has completed the approval process and is ready for payment.
        - const: pending
          description: Invoices that have been requested for payment by users who lack the necessary payment permissions.
        - const: scheduled
          description: Invoice payment has been scheduled but not yet executed. Payment is queued and will be automatically processed at the scheduled time.
        - const: paid
          description: Payment has been completed and received by the supplier.
        - const: archived
          description: Invoice has been moved to archive for record-keeping purposes. Can be accessed and unarchived if needed.
        - const: rejected
          description: Invoice has been formally declined by approvers
        - const: discarded
          description: Invoice has been discarded and is no longer available.
    EInvoicingLifecycleEventStatusCode:
      type: integer
      enum:
        - 200
        - 201
        - 202
        - 203
        - 204
        - 205
        - 206
        - 207
        - 208
        - 209
        - 210
        - 211
        - 212
        - 213
        - 214
      description: |
        Status code of the operation. - 200: Déposée (Submitted) - 201: Emise par la plateforme (Issued by the platform) - 202: Reçue de la plateforme (Received from the platform) - 203: Mise à disposition (Made available) - 204: Prise en charge (Taken over) - 205: Approuvée (Approved) - 206: Approuvée partiellement (Partially approved) - 207: En litige (In dispute) - 208: Suspendue (Suspended) - 209: Complétée (Completed) - 210: Refusée (Refused) - 211: Paiement transmis (Payment sent) - 212: Encaissée (Collected) - 213: Rejetée (Rejected) - 214: Visée (Vised)
      example: 200
    EInvoicingLifecycleEvent:
      type: object
      properties:
        status_code:
          $ref: '#/components/schemas/EInvoicingLifecycleEventStatusCode'
        reason:
          type: string
          description: The reason label associated with a given event
          example: DOUBLE FACTURE
        reason_message:
          type: string
          description: The reason message associated with a given event (comment provided by the user generating the event)
          example: I already received this invoice
        timestamp:
          type: string
          description: The timestamp of the event
          format: date-time
          example: '2024-12-04T11:05:16.4497Z'
      example:
        status_code: 200
        reason: DOUBLE FACTURE
        reason_message: I already received this invoice
        timestamp: '2024-12-04T11:05:16.4497Z'
