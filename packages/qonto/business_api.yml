    EmbeddedInvoiceOrganization:
      type: object
      description: Information of the organization at the time the document was issued.
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        legal_number:
          type: string
        legal_country:
          type: string
        address_line_1:
          type: string
        address_line_2:
          type: string
        address_zipcode:
          type: string
        address_city:
          type: string
        address_country:
          type: string
        company_leadership:
          type: string
          example: Jan Mueller
        district_court:
          type: string
          example: Munich
        commercial_register_number:
          type: string
          description: |-
            Is available for French and German organizations and is optional.
            - For French organizations, it represents RCS number (numéro Registre du Commerce et des Sociétés) of an incorporated business. For example: RCS A 123 123 123.
            - For German organizations, it represents the organization's commercial register number (handelsregisternummer). For example: HRB 123455 B.
          example: HRB12345B
        vat_number:
          type: string
          example: FR123456789
        tax_number:
          type: string
          example: 123/123/1234
        legal_capital_share:
          type: object
          description: Capital share of an incorporated business. It is optional and is only for French organizations.
          properties:
            value:
              type: string
              maxLength: 12
              example: '10000.00'
            currency:
              $ref: '#/components/schemas/Currency'
        transaction_type:
          type: string
          enum:
            - goods
            - services
            - goods_and_services
          description: Type of transaction performed in the invoice. It is optional and is only for French organizations.
          example: goods
        vat_payment_condition:
          type: string
          enum:
            - on_receipts
            - compensated_for_sales
            - exempt
          description: |-
            Business’ VAT elected payment condition (whether TVA is paid on receipt or on invoice emission).
            There are two allowed values:
            - `receipt` which stands for “sur les encaissements” in French;
            -  `compensated_for_sales` which stands for “sur les débits” in French.
            It is optional and is only for French organizations.
          example: on_receipts
    EinvoicingLifecycleEvents:
      type: array
      description: Array of lifecycle events related to the e-invoicing process
      items:
        $ref: '#/components/schemas/EInvoicingLifecycleEvent'
    ClientInvoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
        organization_id:
          type: string
          format: uuid
          example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
        attachment_id:
          type: string
          description: |-
            Attachment UUID corresponding to that particular invoice.
            <br>When creating the invoice (by calling the [POST /v2/client_invoices](/api-reference/business-api/endpoints/client-invoices/create-a-client-invoice) endpoint), the attachment is generated **asynchronously**; which means that you have to wait ~10s and then call the [GET /v2/client_invoices/{id}](https://api-doc.qonto.com/docs/business-api/copd6wc7nwym8-show-client-invoice) endpoint to get the `attachment_id`.
            <br>This property enables you to get the invoice file by using the [GET /v2/attachments/{id}](/api-reference/business-api/endpoints/attachments/retrieve-an-attachment) endpoint.
          format: uuid
          example: 4d5418bb-bd0d-4df4-865c-c07afab8bb48
        number:
          type: string
          example: INV001
        purchase_order:
          type: string
          description: Purchase order data added by the invoice’s initiator.
        status:
          type: string
          enum:
            - draft
            - unpaid
            - paid
            - canceled
          example: paid
        invoice_url:
          type: string
          description: URL of the invoice public page, accessible without authentication for 180 days after issuance, provided the invoice has not been canceled.
          format: uri
          example: https://pay.qonto.com/invoices/00000000-0000-0000-0000-000000000000
        contact_email:
          type: string
          description: E-mail address of the invoice’s initiator.
          format: email
          example: contact@qonto.com
        terms_and_conditions:
          type: string
          description: The T&C data added by the invoice’s initiator.
          example: This is an example.
        discount_conditions:
          type: string
          nullable: true
          description: Any discount for advance payment of the invoice. It is optional and is only for French organizations.
          example: Pas d’escompte accordé pour paiement anticipé.
        late_payment_penalties:
          type: string
          nullable: true
          description: Late payment penalties applied in case of non-payment invoice.  It is optional and is only for French organizations.
          example: En cas de non-paiement à la date d'échéance, des pénalités calculées à trois fois le taux d’intérêt légal seront appliquées.
        legal_fixed_compensation:
          type: string
          nullable: true
          description: The legal fixed compensation applied in case late payment of the invoice. It is optional and is only for French organizations.
          example: Tout retard de paiement entraînera une indemnité forfaitaire pour frais de recouvrement de 40€.
        header:
          type: string
          description: The header text added by the credit note’s initiator.
          example: This is an example.
        footer:
          type: string
          description: The footer text added by the credit note’s initiator.
          example: This is an example.
        currency:
          type: string
          example: EUR
        total_amount:
          type: object
          description: Total amount that needs to be paid by the client.
          properties:
            value:
              type: string
              example: '12.52'
            currency:
              type: string
              example: EUR
        total_amount_cents:
          type: integer
          description: Total amount in cents that needs to be paid by the client.
          example: 1252
        vat_amount:
          type: object
          description: VAT amount that is applicable to the invoice.
          properties:
            value:
              type: string
              example: '0.51'
            currency:
              type: string
              example: EUR
        vat_amount_cents:
          type: integer
          description: VAT amount in cents that is applicable to the invoice.
          example: 51
        issue_date:
          type: string
          description: Date the initiator mentioned that the invoice was created.
          format: date
          example: '2022-03-01'
        due_date:
          type: string
          description: Payment’s deadline added by the initiator.
          format: date
          example: '2022-03-01'
        performance_date:
          type: string
          description: |
            **DEPRECATED**: This field is deprecated. Please use `performance_start_date` and `performance_end_date` instead.

            The performance date represents when the job or service was completed by the client. Date the initiator mentioned that the contents of the invoice were performed.
          format: date
          example: '2022-03-01'
          deprecated: true
        performance_start_date:
          type: string
          description: |
            Start date of the performance period mentioned by the initiator for the invoice contents.

            The performance period defines the date range during which the job or service was completed by the client. This field marks the beginning of that period and can be used together with `performance_end_date` to create a flexible date range instead of a single fixed date.
          format: date
          example: '2022-03-01'
        performance_end_date:
          type: string
          description: |
            End date of the performance period mentioned by the initiator for the invoice contents.

            This field defines the end of the performance date range, allowing the work or service to have been completed anytime between `performance_start_date` and `performance_end_date`. When used together with `performance_start_date`, it creates a flexible time window rather than specifying completion on a single specific date.
          format: date
          example: '2022-03-31'
        created_at:
          type: string
          description: Date the invoice was created. Note that this is a machine date.
          format: date-time
          example: '2022-03-04T17:58:30+02:00'
        finalized_at:
          type: string
          description: Date the invoice was transitioned from `Draft` to `Unpaid` status.
          format: date-time
          example: '2022-03-04T17:58:30+02:00'
        paid_at:
          type: string
          description: Date on which the invoice was paid.
          format: date-time
          example: '2022-03-04T17:58:30+02:00'
        stamp_duty_amount:
          type: string
          minLength: 4
          maxLength: 15
          example: '1.00'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
        client:
          $ref: '#/components/schemas/EmbeddedClient'
        payment_methods:
          type: array
          items:
            type: object
            properties:
              beneficiary_name:
                type: string
                description: Name of the beneficiary that will receive the invoice's payment.
                example: John Doe
              bic:
                type: string
                description: Beneficiary’s International Bank Account Number.
                example: ABCDEFG1XXX
              iban:
                type: string
                description: Beneficiary account's Bank Identifier.
                example: FR1420041010050500013M02606
              type:
                type: string
                enum:
                  - transfer
                description: Invoice's payment method.
                example: transfer
        credit_notes_ids:
          type: array
          description: If any credit notes are linked to the invoice, this represents the id of those credit notes.
          items:
            type: string
            format: uuid
            readOnly: true
        organization:
          $ref: '#/components/schemas/EmbeddedInvoiceOrganization'
        einvoicing_status:
          type: string
          enum:
            - pending
            - submitted
            - declined
            - approved
            - not_delivered
            - submission_failed
        welfare_fund:
          type: object
          properties:
            type:
              type: string
              enum:
                - TC01
                - TC02
                - TC03
                - TC04
                - TC05
                - TC06
                - TC07
                - TC08
                - TC09
                - TC10
                - TC11
                - TC12
                - TC13
                - TC14
                - TC15
                - TC16
                - TC17
                - TC18
                - TC19
                - TC20
                - TC21
                - TC22
              example: TC01
            rate:
              type: string
              minLength: 4
              maxLength: 6
              example: '0.0001'
        withholding_tax:
          type: object
          description: |-
            - Only applicable for Italian organizations and Spanish freelancers.
            - Object which relates to an amount of tax paid by the client, rather than the supplier, for specific cases.
            - This amount is a percentage deducted from the total amount of the invoice after VAT application.
            - The `rate` field specifies the percentage of tax and `amount` field specifies the total amount of the tax.
          properties:
            reason:
              type: string
