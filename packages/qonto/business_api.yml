  /v2/transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: |
        OAuth scope: `organization.read`

        Retrieves the list of transactions for the bank account identified by the `bank_account_id` / `iban` query parameter.

        You can filter (ex: only retrieve the latest transactions) and sort this list by using [query parameters](#parameter-bank-account-id) 👇

        <Info>
          All transactions visible in Qonto's UI can be retrieved, as of API V2.
        </Info>
      parameters:
        - $ref: '#/components/parameters/X-Qonto-Staging-Token'
        - name: bank_account_id
          in: query
          description: '`id` of the bank account for which transactions will be retrieved. Use [/v2/organization](openapi_v2.yml/paths/~1v2~1organization/get) to get this parameter. If both `bank_account_id` and `iban` are specified, `bank_account_id` takes precedence.'
          allowReserved: false
          schema:
            type: string
            example: 018f71db-c635-78b5-b90a-ea05de98c2bf
        - name: iban
          in: query
          description: IBAN of the bank account for which transactions will be retrieved. Use [/v2/organization](openapi_v2.yml/paths/~1v2~1organization/get) to get this parameter. If both `bank_account_id` and `iban` are specified, `bank_account_id` takes precedence.
          schema:
            type: string
            example: FR7616798000010000005663951
        - name: includes[]
          in: query
          description: Use this query parameter to embed the associated resources (labels, attachments and/or VAT details) of the transactions in the JSON response.
          schema:
            type: array
            items:
              type: string
              enum:
                - vat_details
                - labels
                - attachments
        - name: status[]
          in: query
          description: |-
            Transactions can be filtered by their `status` property.
            Possible values:
            - `pending`: a transaction that is processing and has impacted the bank account's `auth_balance` but not its `balance`;
            - `declined`: a transaction that has been declined;
            - `completed`: a transaction that is completed, and has impacted the bank account's `balance`.
          schema:
            type: array
            default: completed
            items:
              type: string
              enum:
                - pending
                - declined
                - completed
              example: status[]=completed&status[]=declined&status[]=pending
        - name: updated_at_from
          in: query
          description: 'Transactions can be filtered by their `updated_at` property. This filter can be used in combination with the `updated_at_to` query parameter to get transactions updated within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance). '
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: updated_at_to
          in: query
          description: Transactions can be filtered by their `updated_at` property. This filter can be used in combination with the `updated_at_to` query parameter to get transactions updated within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance).
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: emitted_at_from
          in: query
          description: Transactions can be filtered by their `emitted_at` property. Can be use in combination with the `emitted_at_to` query parameter to get transactions emitted within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance).
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: emitted_at_to
          in: query
          description: Transactions can be filtered by their `emitted_at` property. This filter can be used in combination with the `emitted_at_from` query parameter to get transactions emitted within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance).
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: settled_at_from
          in: query
          description: Transactions can be filtered by their `settled_at` property. This filter can be used in combination with the `settled_at_to` query parameter to get transactions settled within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance).
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: settled_at_to
          in: query
          description: Transactions can be filtered by their `settled_at` property. This filter can be used in combination with the `settled_at_from` query parameter to get transactions settled within a specific timeframe. Please use a valid date time format (**ISO 8601** for instance).
          schema:
            type: string
            example: '2019-01-10T11:47:53.123Z'
        - name: side
          in: query
          description: Transactions can be filtered by their `side` property.
          schema:
            type: string
            enum:
              - credit
              - debit
        - name: operation_type[]
          in: query
          description: Transactions can be filtered by their `operation_type` property.
          schema:
            type: array
            items:
              type: string
            example: operation_type[]=card&operation_type[]=transfer&operation_type[]=income&operation_type[]=account_remuneration
        - name: with_attachments
          in: query
          description: Transactions can be filtered based on the presence of one or more attachments.
          schema:
            type: boolean
            enum:
              - 'true'
              - 'false'
        - name: sort_by
          in: query
          description: |-
            Transactions can be sorted by a specific property and order.
            Property: `updated_at`, `settled_at` or `emitted_at`
            Order: `asc` (Ascending) / `desc` (Descending)
          schema:
            type: string
            format: property:order
            default: '`settled_at:desc`'
        - name: page
          in: query
          description: Returned page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
        - name: per_page
          in: query
          description: Number of transactions per page (cf. [Pagination](/get-started/general/pagination)).
          schema:
            type: string
      responses:
        '200':
          description: Returns the list of transactions for the specified bank account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              examples:
                Default:
                  value:
                    transactions:
                      - transaction_id: super-transaction-7468
                        amount: 0.43
                        amount_cents: 43
                        settled_balance: 111.1
                        settled_balance_cents: 11110
                        attachment_ids: []
                        local_amount: 0.43
                        local_amount_cents: 43
                        side: debit
                        operation_type: transfer
                        currency: EUR
                        local_currency: EUR
                        label: Ferry-Purdy
                        settled_at: '2021-03-03T16:06:38.000Z'
                        emitted_at: '2021-02-25T16:22:37.000Z'
